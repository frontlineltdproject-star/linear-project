<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FRO-353 · Create Customs Storage Entry preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
__CSS__
/* ---------- FRO-350 shared additions (same tokens) ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem 1.25rem}
.grid4b{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem 1.25rem}
@media (max-width:1100px){.grid4b{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid3,.grid4b{grid-template-columns:minmax(0,1fr)}}
a.link{color:var(--accent-active);text-decoration:underline;text-underline-offset:2px;font-weight:600}
a.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.ro{min-height:2.5rem;display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-2);padding:.375rem .75rem;font-size:.875rem;overflow-wrap:anywhere}
.ro.empty{color:var(--fg-subtle)}
.ro.strong{font-weight:600}
.picker{position:relative}
.popup{position:absolute;left:0;right:0;top:calc(100% + .25rem);z-index:var(--z-popover);max-height:18rem;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow-popover);padding:.25rem;margin:0;list-style:none}
.opt-btn{display:block;width:100%;text-align:left;border:0;background:none;border-radius:var(--radius-md);padding:.5rem .625rem}
.opt-btn:hover,.opt-btn:focus-visible{background:var(--accent-subtle);outline:none}
.opt-btn[aria-disabled=true]{opacity:.6;cursor:not-allowed}
.opt-main{display:block;font-weight:600}.opt-sub{display:block;font-size:.75rem;color:var(--fg-muted)}
.loader{display:flex;justify-content:center;align-items:center;padding:2rem}
.spinner{width:1.75rem;height:1.75rem;border-radius:999px;border:3px solid var(--surface-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status-block{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--canvas);padding:1rem;margin-top:1.25rem}
.status-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.status-head .field{width:min(100%,400px)}
@media (max-width:640px){.status-head .btn{width:100%}}
.stepper3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;list-style:none;margin:1rem 0;padding:0}
.stepper3 .step.done{border-top-color:var(--accent);color:var(--fg)}
.stepper3 .step.done .num{border-color:var(--accent);background:var(--accent-subtle);color:var(--accent-strong)}
.dates2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px}
@media (max-width:640px){.dates2,.stepper3{grid-template-columns:minmax(0,1fr)}}
.unavail{font-size:.75rem;color:var(--fg-muted)}
.page-actions{display:flex;flex-wrap:wrap;gap:.5rem}
.card-sub{margin:.25rem 0 0;font-size:.8125rem;color:var(--fg-muted)}
.add-row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:flex-end;justify-content:space-between;margin-bottom:.75rem}
.add-row .picker{width:min(100%,32rem)}
@media (max-width:639px){.topbar{flex-direction:column}}
.tools:not([open]){width:auto}
.table-wrap{position:relative;max-width:100%}
/* ---------- FRO-353 additions (same tokens) ---------- */
.subcards{display:flex;flex-direction:column;gap:1rem}
.subcard h3{margin:0 0 .75rem}
.full{grid-column:1/-1}
.marker{display:inline-flex;align-items:center;gap:.25rem;margin-left:.375rem;border-radius:var(--radius-md);padding:.0625rem .375rem;font-size:.6875rem;font-weight:600;background:var(--warning-subtle);color:var(--warning-fg)}
tfoot td{border-top:2px solid var(--border-strong);border-bottom:0;font-weight:600;background:var(--canvas)}
.reason{display:block;font-size:.75rem;color:var(--warning-fg)}
.page-actions-row{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.5rem;margin-top:1.25rem}
@media (max-width:640px){.page-actions-row .btn{flex:1 1 auto}}
.result-card .facts{margin-top:.5rem}
.dt-row{display:grid;grid-template-columns:minmax(0,1fr) 8rem;gap:.5rem}
</style>
</head>
<body>
<div class="sim-banner" id="sim-banner"></div>
<div id="app"></div>
<script>
__APP_JS__
</script>
</body>
</html>
