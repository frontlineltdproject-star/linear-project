<script>
'use strict';
const params=new URLSearchParams(location.search),root=document.getElementById('app');
let lang=params.get('lang')==='el'?'el':'en',direction=params.get('direction')==='b'?'b':'a',tab='details',state=params.get('state')||'default',page=params.get('page')||'create',dirty=false,shipperEdited=false,refreshed=false,removedNotice=false,notice='',searchOpen=false;
const t=(en,el)=>lang==='el'?el:en,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Athens',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const front='FRONT LINE\n67, IROON POLYTECHNIOU\n185 36, PIRAEUS, GREECE';
const shipments=[{id:'DEMO-SHP-1042',route:'Piraeus → Singapore',mode:'Sea',date:'2026-11-09',clients:['DEMO Marine Services','DEMO Ocean Supply']},{id:'DEMO-SHP-1043',route:'Athens → Rotterdam',mode:'Air',date:'2026-11-10',clients:['DEMO Marine Services']}];
const companies={'DEMO Marine Services':['DEMO Marine Trading Ltd','DEMO Marine Europe Ltd'],'DEMO Ocean Supply':['DEMO Ocean Logistics Ltd']};
const companyText=c=>c+'\nFICTIONAL ADDRESS 12\n000 00, SAMPLE CITY\nGREECE';
const orders=[{id:'DEMO-PO-2184',client:'DEMO Marine Services',supplier:'DEMO Parts Factory',msg:'DEMO-MSG-084',origin:'Greece',destination:'Singapore',rows:[{id:'r1',description:'Valve assembly',hs:'848180',qty:2,unit:'SET',amount:480,currency:'EUR'},{id:'r2',description:'Seal kit',hs:'401693',qty:4,unit:'PC',amount:120,currency:'EUR'}],unknown:{id:'r3',description:'Pressure sensor',hs:'902620',qty:1,unit:'PC',amount:85,currency:'EUR'}},{id:'DEMO-PO-2191',client:'DEMO Ocean Supply',supplier:'DEMO Technical Supply',msg:'DEMO-MSG-091',origin:'Greece',destination:'Singapore',rows:[{id:'r4',description:'Filter cartridge',hs:'842199',qty:3,unit:'PC',amount:210,currency:'EUR'},{id:'r5',description:'Maintenance kit',hs:'820600',qty:1,unit:'SET',amount:160,currency:'USD'}]}];
function defaults(ship=params.get('entry')==='standalone'?'':shipments[0].id){return {shipment:ship,client:ship===shipments[1].id?'DEMO Marine Services':'',company:'',type:'Invoice',date:today(),subtitle:'PACKING LIST',shipper:front,consignee:'',agent:'',notify:'',packing:'',weight:'',partial:'',partialCurrency:'EUR',notes:''}}
let form=defaults(),selected=new Set(),groupOrder=[];
function visibleOrders(){return form.shipment===shipments[1].id?[orders[0]]:orders}
function allRows(){return visibleOrders().flatMap(o=>[...o.rows,...(refreshed&&o.unknown?[o.unknown]:[])]).filter(r=>!(state==='stale'&&refreshed&&r.id==='r2'))}
function rowsFor(o){return allRows().filter(r=>o.rows.some(x=>x.id===r.id)||o.unknown?.id===r.id)}
function selection(){return allRows().filter(r=>selected.has(r.id))}function mixed(){return new Set(selection().map(r=>r.currency)).size>1}function total(){return selection().reduce((a,r)=>a+r.amount,0)}function money(n,c='EUR'){return new Intl.NumberFormat(lang==='el'?'el-GR':'en-GB',{style:'currency',currency:c}).format(n)}
function marker(n){return '<span class="marker" title="'+t('Business rule ','Επιχειρησιακός κανόνας ')+n+'">'+n+'</span>'}function newTag(){return '<span class="new">'+t('New component','Νέο στοιχείο')+'</span>'}
function setUrl(){const u=new URL(location.href);u.searchParams.set('lang',lang);u.searchParams.set('direction',direction);u.searchParams.set('state',state);history.replaceState(null,'',u)}
function field(key,label,kind='text',hint='',extra=''){const value=form[key];return `<div class="field ${extra}"><label for="${key}">${label}</label>${kind==='textarea'?`<textarea id="${key}" data-field="${key}" rows="3">${esc(value)}</textarea>`:`<input id="${key}" data-field="${key}" type="${kind}" value="${esc(value)}" ${kind==='number'?'min="0" step="0.01"':''}>`}${hint?'<small>'+hint+'</small>':''}</div>`}
function selectField(key,label,options,placeholder=''){return `<div class="field"><label for="${key}">${label}</label><select id="${key}" data-field="${key}">${placeholder?`<option value="">${placeholder}</option>`:''}${options.map(x=>`<option value="${esc(x)}" ${form[key]===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
function card(number,title,body,sub='',actions=''){return `<section class="card"><div class="card-head"><div><h2><span class="step">${number}</span>${title}</h2>${sub?'<p>'+sub+'</p>':''}</div>${actions}</div><div class="card-body">${body}</div></section>`}
function shell(body){return `<div class="shell"><aside class="sidebar"><div class="brand">FRONT LINE<small>FORWARDING & AGENCY</small></div><div class="nav-label">${t('WORKSPACE','ΧΩΡΟΣ ΕΡΓΑΣΙΑΣ')}</div><div class="nav-item"><i>▦</i>${t('Overview','Επισκόπηση')}</div><div class="nav-item"><i>▤</i>${t('Orders','Παραγγελίες')}</div><div class="nav-item"><i>⇄</i>${t('Shipments','Αποστολές')}</div><div class="nav-item active"><i>▧</i>${t('Shipment invoices','Τιμολόγια αποστολών')}</div><div class="nav-item"><i>▱</i>${t('Delivery notes','Δελτία αποστολής')}</div><div class="nav-label">${t('DIRECTORY','ΚΑΤΑΛΟΓΟΣ')}</div><div class="nav-item"><i>▥</i>${t('Companies','Εταιρείες')}</div><div class="nav-item"><i>⌂</i>${t('Warehouses','Αποθήκες')}</div><div class="sidebar-foot">${t('Design preview · sample workspace','Προεπισκόπηση · δοκιμαστικός χώρος')}<br>FRO-244 · ${t('Creation','Δημιουργία')}</div></aside><main class="main"><header class="topbar"><div class="breadcrumb">${t('Documents / Shipment invoices / Create','Έγγραφα / Τιμολόγια αποστολών / Δημιουργία')}</div><div class="top-actions"><div class="lang"><button data-lang="en" class="${lang==='en'?'on':''}">EN</button><button data-lang="el" class="${lang==='el'?'on':''}">ΕΛ</button></div><span class="user-dot">DM</span></div></header><div class="content">${body}</div></main></div>`}
function previewTools(){return `<div class="preview-banner"><span><strong>${t('Design preview','Προεπισκόπηση σχεδιασμού')}</strong> · ${t('Fictional data. Changes are not saved. No production connection.','Πλασματικά δεδομένα. Οι αλλαγές δεν αποθηκεύονται. Καμία σύνδεση με παραγωγή.')}</span><span class="new">HTML · OFFLINE</span></div><section class="preview-tools" aria-label="${t('Preview controls','Χειριστήρια προεπισκόπησης')}"><div class="tools-row"><div class="direction-buttons"><button data-direction="a" class="${direction==='a'?'on':''}">${t('A · Stacked cards','A · Διαδοχικές κάρτες')}</button><button data-direction="b" class="${direction==='b'?'on':''}">${t('B · Compact tabs','B · Συμπαγείς καρτέλες')}</button></div><label for="scenario">${t('Scenario','Σενάριο')}</label><select id="scenario">${[['default',t('Default','Κανονική προβολή')],['loading',t('Loading goods','Φόρτωση ειδών')],['empty',t('No eligible goods','Χωρίς επιλέξιμα είδη')],['error',t('Load error','Σφάλμα φόρτωσης')],['mixed',t('Mixed currencies','Μικτά νομίσματα')],['overlap',t('Already invoiced row','Ήδη τιμολογημένη γραμμή')],['stale',t('Source row removed','Αφαίρεση αρχικής γραμμής')]].map(([v,l])=>`<option value="${v}" ${state===v?'selected':''}>${l}</option>`).join('')}</select><button class="btn small ghost" id="reset">↺ ${t('Reset','Επαναφορά')}</button></div><p class="direction-note">${direction==='a'?t('<strong>A — recommended.</strong> One continuous form makes document fields and goods easy to review together. Longer page.','<strong>A — προτεινόμενη.</strong> Ενιαία φόρμα για έλεγχο εγγράφου και ειδών μαζί. Μεγαλύτερο μήκος σελίδας.'):t('<strong>B — compact.</strong> Details, goods and packing use tabs with persistent actions. Less scrolling; review needs tab changes.','<strong>B — συμπαγής.</strong> Στοιχεία, είδη και συσκευασία σε καρτέλες με σταθερές ενέργειες. Λιγότερη κύλιση, περισσότερες αλλαγές καρτελών.')} ${t('Both add Shipment search, grouped row selection and totals compositions.','Και οι δύο προσθέτουν αναζήτηση αποστολής, ομαδοποιημένες γραμμές και σύνολα.')} ${newTag()}</p><details><summary>${t('Business rules & design notes','Επιχειρησιακοί κανόνες & σημειώσεις σχεδιασμού')}</summary><p>${t('There is no existing Shipment Invoice create screen to compare. These directions mirror live portal components. The ticket is the behavior contract; this HTML demonstrates the look and temporary interactions. Native selects/date inputs approximate the portal pickers.','Δεν υπάρχει υπάρχουσα σελίδα δημιουργίας για σύγκριση. Οι προτάσεις ακολουθούν τα στοιχεία της πύλης. Το ticket ορίζει τη συμπεριφορά· το HTML δείχνει την εμφάνιση και προσωρινές αλληλεπιδράσεις. Τα εγγενή πεδία επιλογής/ημερομηνίας προσεγγίζουν τα στοιχεία της πύλης.')}</p><div class="notes-grid">${[[1,t('One non-cancelled Shipment per draft. Changing it resets the form after confirmation.','Μία μη ακυρωμένη αποστολή ανά πρόχειρο. Η αλλαγή επαναφέρει τη φόρμα μετά από επιβεβαίωση.')],[2,t('Company choice prefills Shipper; edited text is protected by a confirmation.','Η εταιρεία συμπληρώνει τον αποστολέα· το επεξεργασμένο κείμενο προστατεύεται με επιβεβαίωση.')],[3,t('No goods are initially selected. Selecting an Order includes its eligible rows.','Αρχικά δεν επιλέγονται είδη. Η επιλογή παραγγελίας περιλαμβάνει τις επιλέξιμες γραμμές της.')],[4,t('Unknown allocation is resolved on the Order. Refresh preserves edits and valid selections.','Η άγνωστη κατανομή επιλύεται στην παραγγελία. Η ανανέωση διατηρεί αλλαγές και έγκυρες επιλογές.')],[5,t('Keep mixed-currency rows visible, show no total and block Create draft.','Οι γραμμές μικτών νομισμάτων παραμένουν ορατές χωρίς σύνολο και μπλοκάρουν τη δημιουργία.')],[6,t('Save an incomplete draft with a Shipment. No finalization or printed number here.','Αποθήκευση ελλιπούς πρόχειρου με αποστολή. Χωρίς οριστικοποίηση ή έντυπο αριθμό εδώ.')]].map(([n,l])=>'<p>'+marker(n)+' '+l+'</p>').join('')}</div></details></section>`}
function shipmentCard(){const ship=shipments.find(s=>s.id===form.shipment);return card('1',t('Shipment','Αποστολή')+marker(1),`<div class="field"><label for="shipment-search">${t('Choose Shipment','Επιλέξτε αποστολή')} <span class="required">*</span> ${newTag()}</label><div class="search-wrap"><input id="shipment-search" type="text" autocomplete="off" placeholder="${t('Search Shipment reference…','Αναζήτηση αναφοράς αποστολής…')}" value="${esc(ship?.id||'')}" aria-expanded="${searchOpen}" aria-controls="shipment-options"><div id="shipment-options" class="shipment-results" ${searchOpen?'':'hidden'}>${shipmentOptions('')}</div></div><small>${t('Sample non-cancelled Shipments. No live search is performed.','Δοκιμαστικές μη ακυρωμένες αποστολές. Δεν εκτελείται ζωντανή αναζήτηση.')}</small></div>${ship?`<div class="shipment-summary"><div><strong>${ship.id}</strong><p>${ship.route} · ${ship.mode==='Sea'?t('Sea','Θάλασσα'):t('Air','Αεροπορικώς')}</p></div><div><span class="pill">${t('Preparing','Σε προετοιμασία')}</span><p>${ship.clients.length} ${t('represented clients','εκπροσωπούμενοι πελάτες')}</p></div></div>`:''}`)}
function shipmentOptions(q){const matches=shipments.filter(s=>(s.id+' '+s.route).toLowerCase().includes(q.toLowerCase()));return matches.length?matches.map(s=>`<button type="button" class="shipment-option ${s.id===form.shipment?'current':''}" data-ship="${s.id}"><span class="mono">${s.id}</span><small>${s.route} · ${s.clients.length} ${t('clients','πελάτες')}</small></button>`).join(''):`<div class="empty" style="padding:12px">${t('No matching Shipments.','Δεν βρέθηκαν αποστολές.')}</div>`}
function documentCard(){const ship=shipments.find(s=>s.id===form.shipment);return card('2',t('Document details','Στοιχεία εγγράφου'),`<div class="grid three">${selectField('client',t('Commercial Client','Εμπορικός πελάτης'),ship?.clients||[],t('Choose Client','Επιλέξτε πελάτη'))}${selectField('company',t('Invoicing company','Εταιρεία τιμολόγησης')+marker(2),companies[form.client]||[],t('Choose company','Επιλέξτε εταιρεία'))}${selectField('type',t('Invoice type','Τύπος τιμολογίου'),['Invoice','Commercial Invoice','Pro-forma Invoice','Shipping Invoice'])}${field('date',t('Document date','Ημερομηνία εγγράφου'),'date',t('Defaults to today in Athens; editable.','Αρχικά σήμερα στην Αθήνα· επεξεργάσιμη.'))}${field('subtitle',t('Subtitle','Υπότιτλος'),'text',t('Optional. Clear it if not needed.','Προαιρετικό. Μπορεί να διαγραφεί.'))}<div class="field"><label>${t('Printed number','Έντυπος αριθμός')}</label><div class="input muted">${t('Assigned on finalization','Αποδίδεται στην οριστικοποίηση')}</div><small>${t('Saving a draft consumes no number.','Η αποθήκευση πρόχειρου δεν δεσμεύει αριθμό.')}</small></div></div>`)}
function partiesCard(){return card('3',t('Document parties','Συμβαλλόμενοι εγγράφου'),`<div class="grid">${field('shipper',t('Shipper','Αποστολέας')+marker(2),'textarea',t('Document text; editing does not change the company record.','Κείμενο εγγράφου· δεν αλλάζει η εγγραφή εταιρείας.'))}${field('consignee',t('Consignee','Παραλήπτης'),'textarea')}${field('agent',t('Agent','Πράκτορας'),'textarea')}${field('notify',t('Notify','Προς ειδοποίηση'),'textarea',t('Optional.','Προαιρετικό.'))}</div>`)}
function goodsCard(){let body='';if(!form.shipment){body=empty(t('Choose a Shipment first','Επιλέξτε πρώτα αποστολή'),t('Its eligible Order invoice rows will appear here.','Εδώ θα εμφανιστούν οι επιλέξιμες γραμμές τιμολογίων.'))}else if(state==='loading'){body=`<div role="status" aria-live="polite"><p class="small muted">${t('Loading eligible goods…','Φόρτωση επιλέξιμων ειδών…')}</p><div class="skeleton"></div><div class="skeleton short"></div><div class="skeleton"></div><button class="btn small" id="finish-loading">${t('Show loaded fixture','Εμφάνιση δοκιμαστικών δεδομένων')}</button></div>`}else if(state==='error'){body=`<div class="alert danger" role="alert">${t('Eligible goods could not be loaded. Your entered fields are kept.','Δεν ήταν δυνατή η φόρτωση ειδών. Τα πεδία σας διατηρούνται.')} <button class="btn small" id="retry">${t('Retry','Επανάληψη')}</button></div>`}else if(state==='empty'){body=empty(t('No eligible invoice rows yet','Δεν υπάρχουν επιλέξιμες γραμμές'),t('You can save the draft and add goods after their allocation is available.','Μπορείτε να αποθηκεύσετε το πρόχειρο και να προσθέσετε είδη όταν είναι διαθέσιμη η κατανομή.'))}else{const list=[...visibleOrders()].sort((a,b)=>{const ai=groupOrder.indexOf(a.id),bi=groupOrder.indexOf(b.id);return (ai<0?99:ai)-(bi<0?99:bi)});body=list.map(o=>{const rows=rowsFor(o),chosen=rows.filter(r=>selected.has(r.id)).length;return `<article class="order"><div class="order-head"><div class="order-heading"><input type="checkbox" data-order="${o.id}" aria-label="${t('Select eligible rows of','Επιλογή επιλέξιμων γραμμών της')} ${o.id}" ${chosen===rows.length&&chosen?'checked':''} data-indeterminate="${chosen>0&&chosen<rows.length}"><div><strong class="mono">${o.id}</strong><p>${o.client} · ${o.supplier}</p><p><span class="mono">${o.msg}</span> · ${t('Origin','Προέλευση')}: ${o.origin} → ${o.destination} · ${t('In stock','Σε απόθεμα')}</p></div></div><span class="order-count">${chosen}/${rows.length} ${t('rows selected','επιλεγμένες γραμμές')}</span></div><div class="table-scroll"><table><thead><tr><th>${t('Include / Description','Επιλογή / Περιγραφή')}</th><th>HS</th><th>${t('Order reference','Αναφορά παραγγελίας')}</th><th class="num">${t('Qty','Ποσ.')}</th><th>${t('Unit','Μονάδα')}</th><th class="num">${t('Line amount','Αξία γραμμής')}</th><th>${t('Currency','Νόμισμα')}</th></tr></thead><tbody>${rows.map(r=>`<tr class="${selected.has(r.id)?'selected':''}"><td><label class="goods-label"><input type="checkbox" data-row="${r.id}" ${selected.has(r.id)?'checked':''}><span>${esc(r.description)}${state==='overlap'&&r.id==='r1'?'<br><span class="small muted">'+t('Also on DEMO-INV-008','Επίσης στο DEMO-INV-008')+'</span>':''}${r.id==='r3'?'<br><span class="small muted">'+t('Group confirmed · exact colli unknown','Επιβεβαιωμένη ομάδα · άγνωστο ακριβές κόλι')+'</span>':''}</span></label></td><td class="mono">${r.hs}</td><td class="mono">${o.msg}</td><td class="num mono">${r.qty}</td><td>${r.unit}</td><td class="num mono">${money(r.amount,r.currency)}</td><td class="mono">${r.currency}</td></tr>`).join('')}</tbody></table></div>${o.unknown&&!refreshed?`<div class="unresolved"><div class="unresolved-title"><span>${t('Awaiting allocation','Σε αναμονή κατανομής')}${marker(4)}</span><span class="pill" style="color:var(--warning);background:var(--warning-bg)">${t('Not selectable','Μη επιλέξιμη')}</span></div><p>${t('Confirm the goods on the Order first, then refresh eligibility. Nothing is added automatically.','Επιβεβαιώστε τα είδη στην παραγγελία και ανανεώστε την επιλεξιμότητα. Τίποτα δεν προστίθεται αυτόματα.')}</p><div class="unknown-row"><input type="checkbox" disabled aria-label="${t('Pressure sensor awaiting allocation','Αισθητήρας πίεσης σε αναμονή κατανομής')}"><span>${o.unknown.description} · <span class="mono">${money(o.unknown.amount)}</span></span><button class="btn small" data-allocation="${o.id}">${t('Open Order allocation ↗','Άνοιγμα κατανομής ↗')}</button></div></div>`:''}</article>`}).join('');body+=`<div class="goods-summary"><span>${selection().length} ${t('selected rows','επιλεγμένες γραμμές')} ${newTag()}</span><span>${t('Full total','Πλήρες σύνολο')}: <strong class="mono">${mixed()?'—':money(total(),selection()[0]?.currency||'EUR')}</strong>${marker(5)}</span></div>`;if(mixed())body+=`<div class="alert danger" role="alert" style="margin-top:12px">${t('Mixed currencies: keep rows in one currency to create the draft. No combined total is shown. Your selections are kept.','Μικτά νομίσματα: κρατήστε γραμμές σε ένα νόμισμα για δημιουργία πρόχειρου. Δεν εμφανίζεται συνολικό ποσό. Οι επιλογές σας διατηρούνται.')}</div>`;if(state==='overlap'&&selected.has('r1'))body+=`<div class="alert warning" style="margin-top:12px">${t('Valve assembly also appears on DEMO-INV-008 for this Shipment. You may proceed after reviewing the overlap.','Η γραμμή Valve assembly υπάρχει και στο DEMO-INV-008 της αποστολής. Μπορείτε να συνεχίσετε αφού ελέγξετε την επικάλυψη.')}</div>`}return card('4',t('Goods selection','Επιλογή ειδών')+marker(3),body,t('Choose Orders, then deselect any eligible rows you do not need.','Επιλέξτε παραγγελίες και αποεπιλέξτε γραμμές που δεν χρειάζεστε.'),`<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">${newTag()}<button id="refresh" class="btn small" ${!form.shipment?'disabled':''}>↻ ${t('Refresh eligibility','Ανανέωση επιλεξιμότητας')}</button></div>`)}
function packingCard(){return card('5',t('Packing, values & notes','Συσκευασία, αξίες & σημειώσεις'),`<div class="grid">${field('packing',t('Packing details','Στοιχεία συσκευασίας'),'textarea',t('Enter packing for the goods on this invoice.','Καταχωρίστε τη συσκευασία των ειδών αυτού του τιμολογίου.'))}${field('weight',t('Total gross weight (kg)','Συνολικό μικτό βάρος (kg)'),'number',t('Manual entry. Not inferred from the whole Shipment.','Χειροκίνητη καταχώριση. Δεν προκύπτει από ολόκληρη την αποστολή.'))}</div><div class="totals" style="margin-top:18px"><div class="total-panel"><span class="field-label">${t('Full invoice total','Πλήρες σύνολο τιμολογίου')} ${marker(5)}</span><div class="amount">${mixed()?'—':money(total(),selection()[0]?.currency||'EUR')}</div><p>${mixed()?t('Resolve the mixed-currency selection.','Επιλύστε την επιλογή μικτών νομισμάτων.'):t('Calculated from selected rows. Read-only.','Υπολογίζεται από τις επιλεγμένες γραμμές. Μόνο ανάγνωση.')}</p></div><div class="total-panel"><div class="grid">${field('partial',t('Partial invoice total','Μερικό σύνολο τιμολογίου'),'number')}${selectField('partialCurrency',t('Currency','Νόμισμα'),['EUR','USD','GBP'])}</div><p style="margin-top:8px">${t('Optional manual amount for a future partial print. Does not change the full total.','Προαιρετικό χειροκίνητο ποσό για μελλοντική μερική εκτύπωση. Δεν αλλάζει το πλήρες σύνολο.')}</p></div></div><div style="margin-top:18px">${field('notes',t('Notes','Σημειώσεις'),'textarea',t('Optional document notes.','Προαιρετικές σημειώσεις εγγράφου.'))}</div>`)}
function empty(title,copy){return `<div class="empty"><div class="icon">▧</div><h3>${title}</h3><p>${copy}</p></div>`}
function render(){document.documentElement.lang=lang;if(page==='allocation'){renderAllocation();return}if(page==='saved'||page==='return'){renderLanding();return}let sections=direction==='a'?shipmentCard()+documentCard()+partiesCard()+goodsCard()+packingCard():shipmentCard()+(tab==='details'?documentCard()+partiesCard():tab==='goods'?goodsCard():packingCard());root.innerHTML=shell(previewTools()+`<div class="page-head"><div><button class="back" id="back">← ${(params.get('entry')==='standalone'?t('Back','Επιστροφή'):t('Back to Shipment','Επιστροφή στην αποστολή'))}</button><h1>${t('Create Shipment Invoice','Δημιουργία τιμολογίου αποστολής')}</h1><p>${t('Prepare the document and choose the goods it will cover.','Προετοιμάστε το έγγραφο και επιλέξτε τα είδη που θα καλύπτει.')}</p></div><span class="draft-badge">${t('New draft · unnumbered','Νέο πρόχειρο · χωρίς αριθμό')}</span></div>${notice?`<div class="alert ${removedNotice?'warning':'info'} notice" role="status">${notice}</div>`:''}${direction==='b'?`<div class="tabs" role="tablist">${[['details',t('Details','Στοιχεία')],['goods',t('Goods','Είδη')],['packing',t('Packing & notes','Συσκευασία & σημειώσεις')]].map(([id,l])=>`<button role="tab" data-tab="${id}" aria-selected="${id===tab}" class="${id===tab?'on':''}" tabindex="${id===tab?'0':'-1'}">${l}</button>`).join('')}</div>`:''}<div class="stack">${sections}</div><footer class="actions"><p>${marker(6)} ${t('Creates an unnumbered draft. Missing details can be completed later.','Δημιουργεί πρόχειρο χωρίς αριθμό. Τα ελλιπή στοιχεία συμπληρώνονται αργότερα.')}</p><div class="action-buttons"><button class="btn" id="cancel">${t('Cancel','Ακύρωση')}</button><button class="btn primary" id="create" ${!form.shipment||mixed()||['loading','error'].includes(state)?'disabled':''}>${t('Create draft','Δημιουργία πρόχειρου')}</button></div></footer>`);bind();document.querySelectorAll('[data-indeterminate="true"]').forEach(e=>e.indeterminate=true)}
function confirmAction(title,copy,yes,no,action,onNo=()=>{}){const d=document.getElementById('confirm'),prior=document.activeElement;document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-copy').textContent=copy;const close=()=>{d.close();prior?.focus()};document.getElementById('dialog-no').textContent=no;document.getElementById('dialog-yes').textContent=yes;document.getElementById('dialog-no').onclick=()=>{close();onNo()};document.getElementById('dialog-yes').onclick=()=>{close();action()};d.oncancel=()=>{onNo()};d.showModal();document.getElementById('dialog-no').focus()}
function changeShipment(id){searchOpen=false;if(id===form.shipment){render();return}const reset=()=>{form=defaults(id);selected.clear();groupOrder=[];shipperEdited=false;refreshed=false;removedNotice=false;dirty=false;notice=t('Shipment changed. Document fields and goods selection were reset to defaults.','Η αποστολή άλλαξε. Τα πεδία και οι επιλογές ειδών επανήλθαν στις αρχικές τιμές.');render()};if(dirty)confirmAction(t('Change Shipment?','Αλλαγή αποστολής;'),t('This clears your entered document fields, parties, packing, amounts and selected goods. Cancel keeps your current draft.','Θα διαγραφούν τα συμπληρωμένα στοιχεία, οι συμβαλλόμενοι, η συσκευασία, τα ποσά και οι επιλογές ειδών. Η ακύρωση διατηρεί το πρόχειρο.'),t('Change & reset','Αλλαγή & επαναφορά'),t('Keep draft','Διατήρηση πρόχειρου'),reset,render);else reset()}
function changeCompany(value){const previous=form.company;const apply=(replace)=>{form.company=value;if(replace){form.shipper=value?companyText(value):front;shipperEdited=false}dirty=true;render()};if(shipperEdited&&value!==previous)confirmAction(t('Replace edited Shipper text?','Αντικατάσταση επεξεργασμένου αποστολέα;'),t('Your Shipper text was edited. Replace it with the selected company’s details, or keep the edited document text.','Το κείμενο αποστολέα έχει αλλάξει. Αντικαταστήστε το με τα στοιχεία της επιλεγμένης εταιρείας ή κρατήστε το επεξεργασμένο κείμενο.'),t('Replace text','Αντικατάσταση κειμένου'),t('Keep edited text','Διατήρηση κειμένου'),()=>apply(true),()=>apply(false));else apply(true)}
function leave(){const done=()=>{dirty=false;page='return';render()};if(dirty)confirmAction(t('Discard this draft?','Απόρριψη πρόχειρου;'),t('Your unsaved inputs and goods selection will be lost.','Τα μη αποθηκευμένα πεδία και η επιλογή ειδών θα χαθούν.'),t('Discard draft','Απόρριψη πρόχειρου'),t('Keep editing','Συνέχεια επεξεργασίας'),done);else done()}
function scenario(value){state=value;refreshed=false;removedNotice=false;notice='';selected.clear();groupOrder=[];if(value==='mixed'){selected=new Set(['r1','r5']);groupOrder=[orders[1].id,orders[0].id]}if(value==='overlap'||value==='stale'){selected.add(value==='stale'?'r2':'r1');groupOrder=[orders[0].id]}dirty=selected.size>0;setUrl();render()}
function refresh(){if(!form.shipment)return;const old=new Set(selected);refreshed=true;state=['loading','error','empty'].includes(state)?'default':state;const eligible=new Set(allRows().map(r=>r.id));selected=new Set([...selected].filter(id=>eligible.has(id)));removedNotice=selected.size<old.size;notice=removedNotice?t('Eligibility refreshed. Seal kit is no longer eligible and was removed from your selection. Review the goods before continuing. Your other inputs and eligible selections are kept. Newly eligible rows are not selected.','Η επιλεξιμότητα ανανεώθηκε. Το Seal kit δεν είναι πλέον επιλέξιμο και αφαιρέθηκε από την επιλογή. Ελέγξτε τα είδη. Τα άλλα πεδία και οι έγκυρες επιλογές διατηρούνται. Οι νέες επιλέξιμες γραμμές δεν επιλέγονται.'):t('Fixture eligibility refreshed. Pressure sensor is now eligible after a simulated group confirmation; it is not selected. Your fields and existing eligible selections are kept.','Η δοκιμαστική επιλεξιμότητα ανανεώθηκε. Το Pressure sensor είναι πλέον επιλέξιμο μετά από προσομοίωση επιβεβαίωσης ομάδας· δεν επιλέχθηκε. Τα πεδία και οι έγκυρες επιλογές διατηρούνται.');setUrl();render()}
function bind(){document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;setUrl();render()});document.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>{direction=b.dataset.direction;setUrl();render()});document.querySelectorAll('[data-tab]').forEach(b=>{b.onclick=()=>{tab=b.dataset.tab;render()};b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const ids=['details','goods','packing'];tab=e.key==='Home'?ids[0]:e.key==='End'?ids[2]:ids[(ids.indexOf(tab)+(e.key==='ArrowRight'?1:2))%3];render();document.querySelector('[data-tab="'+tab+'"]').focus()}}});document.getElementById('scenario').onchange=e=>scenario(e.target.value);document.getElementById('reset').onclick=()=>{form=defaults();selected.clear();groupOrder=[];dirty=false;shipperEdited=false;scenario('default')};document.querySelectorAll('[data-field]').forEach(e=>{const key=e.dataset.field;e.addEventListener('input',()=>{if(['company','client'].includes(key))return;form[key]=e.value;dirty=true;if(key==='shipper')shipperEdited=true});if(key==='company')e.onchange=()=>changeCompany(e.value);if(key==='client')e.onchange=()=>{form.client=e.value;form.company='';dirty=true;render()}});const search=document.getElementById('shipment-search');search.onfocus=()=>{searchOpen=true;document.getElementById('shipment-options').hidden=false;search.setAttribute('aria-expanded','true');search.select()};search.oninput=()=>{document.getElementById('shipment-options').innerHTML=shipmentOptions(search.value);bindShipButtons()};search.onkeydown=e=>{if(e.key==='Escape'){searchOpen=false;document.getElementById('shipment-options').hidden=true;search.value=form.shipment;search.setAttribute('aria-expanded','false')}};bindShipButtons();document.querySelectorAll('[data-row]').forEach(e=>e.onchange=()=>{e.checked?selected.add(e.dataset.row):selected.delete(e.dataset.row);dirty=true;render()});document.querySelectorAll('[data-order]').forEach(e=>e.onchange=()=>{const o=orders.find(o=>o.id===e.dataset.order);if(e.checked){rowsFor(o).forEach(r=>selected.add(r.id));groupOrder=[o.id,...groupOrder.filter(id=>id!==o.id)]}else{rowsFor(o).forEach(r=>selected.delete(r.id));groupOrder=groupOrder.filter(id=>id!==o.id)}dirty=true;render()});document.querySelectorAll('[data-allocation]').forEach(e=>e.onclick=()=>{const u=new URL(location.href);u.searchParams.set('page','allocation');u.searchParams.set('order',e.dataset.allocation);window.open(u.href,'_blank','noopener')});document.getElementById('refresh')?.addEventListener('click',refresh);document.getElementById('retry')?.addEventListener('click',()=>scenario('default'));document.getElementById('finish-loading')?.addEventListener('click',()=>scenario('default'));document.getElementById('cancel').onclick=leave;document.getElementById('back').onclick=leave;document.getElementById('create').onclick=()=>{if(!form.shipment||mixed())return;dirty=false;page='saved';render()}}
function bindShipButtons(){document.querySelectorAll('[data-ship]').forEach(b=>b.onclick=()=>changeShipment(b.dataset.ship))}
function renderLanding(){root.innerHTML=shell(`<div class="saved">${previewTools()}<div class="alert info">${t('Simulation only. No record was saved and no navigation to production occurred.','Μόνο προσομοίωση. Δεν αποθηκεύτηκε εγγραφή και δεν έγινε πλοήγηση στην παραγωγή.')}</div><div class="page-head" style="margin-top:24px"><div><h1>${page==='saved'?t('Shipment Invoice draft','Πρόχειρο τιμολόγιο αποστολής'):t('Return destination','Προορισμός επιστροφής')}</h1><p>${page==='saved'?t('Simulated Details page — future ticket','Προσομοίωση σελίδας στοιχείων — μελλοντικό ticket'):t('From Shipment: return to that Shipment. Standalone: previous page, or Shipments list as fallback.','Από αποστολή: επιστροφή σε αυτή. Αυτόνομη δημιουργία: προηγούμενη σελίδα ή λίστα αποστολών.')}</p></div></div>${page==='saved'?`<section class="card"><div class="card-body"><dl><dt>${t('Internal draft ID','Εσωτερικό ID πρόχειρου')}</dt><dd class="mono">DEMO-DRAFT-001</dd><dt>${t('Printed number','Έντυπος αριθμός')}</dt><dd>${t('Not assigned','Δεν έχει αποδοθεί')}</dd><dt>${t('Shipment','Αποστολή')}</dt><dd class="mono">${esc(form.shipment)}</dd><dt>${t('Invoice type','Τύπος τιμολογίου')}</dt><dd>${esc(form.type)}</dd><dt>${t('Selected rows','Επιλεγμένες γραμμές')}</dt><dd>${selection().length}</dd><dt>${t('Full total','Πλήρες σύνολο')}</dt><dd class="mono">${money(total(),selection()[0]?.currency||'EUR')}</dd></dl><p class="small muted">${t('Finalization, editing and printing are not implemented in this create-page preview.','Η οριστικοποίηση, επεξεργασία και εκτύπωση δεν υλοποιούνται σε αυτή την προεπισκόπηση δημιουργίας.')}</p></div></section>`:''}<button class="btn primary" id="back-preview" style="margin-top:18px">${t('Back to create preview','Επιστροφή στην προεπισκόπηση')}</button></div>`);document.getElementById('back-preview').onclick=()=>{page='create';render()};document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});document.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>{direction=b.dataset.direction;page='create';render()});document.getElementById('reset').onclick=()=>{page='create';form=defaults();scenario('default')};document.getElementById('scenario').onchange=e=>{page='create';scenario(e.target.value)}}
function renderAllocation(){root.innerHTML=`<main class="allocation-page"><div class="preview-banner">${t('Simulation only · no data is saved','Μόνο προσομοίωση · δεν αποθηκεύονται δεδομένα')}</div><h1 style="font-size:23px">${t('Order invoice-row allocation','Κατανομή γραμμών τιμολογίου παραγγελίας')}</h1><p class="mono">${esc(params.get('order')||'DEMO-PO-2184')}</p><section class="card"><div class="card-body"><span class="pill">${t('Colli unknown','Άγνωστο κόλι')}</span><h2 style="font-size:17px">Pressure sensor · EUR 85.00</h2><p>${t('This separate fixture page represents the Order allocation workflow owned by FRO-301. It does not alter the create-page draft.','Αυτή η ξεχωριστή δοκιμαστική σελίδα αναπαριστά τη ροή κατανομής παραγγελίας του FRO-301. Δεν αλλάζει το πρόχειρο της σελίδας δημιουργίας.')}</p><button class="btn primary" id="simulate-allocation">${t('Simulate group confirmation','Προσομοίωση επιβεβαίωσης ομάδας')}</button><p id="allocation-feedback" role="status" class="small muted">${t('Return to the create tab and use Refresh eligibility.','Επιστρέψτε στην καρτέλα δημιουργίας και πατήστε Ανανέωση επιλεξιμότητας.')}</p></div></section></main>`;document.getElementById('simulate-allocation').onclick=e=>{e.target.disabled=true;document.getElementById('allocation-feedback').textContent=t('Fixture confirmation demonstrated. Return to the create tab and click Refresh eligibility to load the refreshed fixture. No real allocation was saved.','Η δοκιμαστική επιβεβαίωση παρουσιάστηκε. Επιστρέψτε στη δημιουργία και πατήστε Ανανέωση επιλεξιμότητας. Δεν αποθηκεύτηκε πραγματική κατανομή.')}}
window.addEventListener('beforeunload',e=>{if(dirty&&page==='create'){e.preventDefault();e.returnValue=''}});
if(['mixed','overlap','stale'].includes(state)){const start=state;scenario(start)}else render();
</script></body></html>
