const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Athens',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const initial=()=>({type:'Invoice',subtitle:'PACKING LIST',date:'2026-11-05',client:'DEMO Client A',company:'DEMO Trading A',shipper:'DEMO Trading A\n10 Example Road, Demo City',consignee:'DEMO Marine Services\n20 Sample Avenue',agent:'DEMO Port Agency\n30 Test Street',notify:'',packing:'2 cartons',weight:'48',partial:'',currency:'EUR',notes:'Handle with care.',selected:['r1','r2']});

const mixed=()=>new Set(picked().map(r=>r.currency)).size>1;
const sum=()=>picked().reduce((n,r)=>n+r.amount,0);
const money=n=>new Intl.NumberFormat(lang==='el'?'el-GR':'en-GB',{style:'currency',currency:picked()[0]?.currency||'EUR'}).format(n);

const fresh=()=>`<span class="new">${t('New component','Νέο στοιχείο')}</span>`;
const btn=(id,en,el,kind='',disabled=false)=>`<button type="button" id="${id}" class="btn ${kind}" ${disabled?'disabled':''}>${t(en,el)}</button>`;

function goods(){return `<div class="tools-row"><p class="small muted">${marker(3)} ${status==='draft'?t('Live source rows · refresh preserves your document fields.','Τρέχουσες γραμμές · η ανανέωση διατηρεί τα πεδία σας.'):t('Frozen at finalization · later source changes do not apply.','Σταθερές τιμές οριστικοποίησης · οι μεταγενέστερες αλλαγές δεν εφαρμόζονται.')}</p>${status==='draft'?btn('refresh','Refresh goods','Ανανέωση αγαθών','small',conflict):''}</div>${mixed()?`<div class="alert danger" role="alert">${t('Mixed currencies. Keep rows in one currency to save. No combined total is shown.','Διαφορετικά νομίσματα. Κρατήστε γραμμές ενός νομίσματος για αποθήκευση. Δεν εμφανίζεται συνολικό ποσό.')}</div>`:''}${state==='overlap'?`<div class="alert warning">${t('Seal kit also appears on DEMO invoice 0041. You may continue.','Το σετ στεγανών περιλαμβάνεται και στο DEMO 0041. Μπορείτε να συνεχίσετε.')}</div>`:''}${[...new Set(rows.map(r=>r.order))].map(order=>{const group=rows.filter(r=>r.order===order),selected=group.filter(r=>form.selected.includes(r.id));if(!editing&&!selected.length)return '';return `<div class="order"><div class="order-head"><div><strong class="mono">${order}</strong><p class="small muted">DEMO Client A · DEMO Supplier · MSG-EXAMPLE · ${t('Origin: Greece · Destination: Netherlands · In stock','Προέλευση: Ελλάδα · Προορισμός: Ολλανδία · Σε απόθεμα')}</p></div>${editing?`<label class="small"><input type="checkbox" data-group="${order}" ${group.filter(r=>!r.unavailable).every(r=>form.selected.includes(r.id))?'checked':''} ${conflict?'disabled':''}> ${t('Select Order','Επιλογή παραγγελίας')}</label>`:''}</div><div class="table-scroll"><table><thead><tr><th>${t('Include','Επιλογή')}</th><th>${t('Description','Περιγραφή')}</th><th>HS</th><th>${t('Quantity','Ποσότητα')}</th><th>${t('Amount','Ποσό')}</th></tr></thead><tbody>${group.filter(r=>editing||form.selected.includes(r.id)).map(r=>`<tr class="${form.selected.includes(r.id)?'selected':''}"><td>${editing?`<input aria-label="${esc(r.name)}" type="checkbox" data-row="${r.id}" ${form.selected.includes(r.id)?'checked':''} ${r.unavailable||conflict?'disabled':''}>`:form.selected.includes(r.id)?'✓':'—'}</td><td>${esc(r.name)}${r.unavailable?`<div class="small">${t('Unavailable · review required','Μη διαθέσιμο · απαιτείται έλεγχος')}</div>`:''}</td><td class="mono">${r.hs}</td><td class="mono">${r.qty} ${r.unit}</td><td class="mono">${r.amount.toFixed(2)} ${r.currency}</td></tr>`).join('')}</tbody></table></div></div>`}).join('')}${!picked().length?`<div class="alert info">${t('No goods selected. Edit the draft to choose eligible rows.','Δεν έχουν επιλεγεί αγαθά. Επεξεργαστείτε το πρόχειρο για επιλογή γραμμών.')}</div>`:''}${editing?`<div class="unresolved"><strong>${t('Allocation unresolved','Εκκρεμεί κατανομή')}</strong><p>${t('DEMO spare part · not selectable until allocation is confirmed.','DEMO ανταλλακτικό · δεν επιλέγεται πριν επιβεβαιωθεί η κατανομή.')}</p><a class="btn small" target="_blank" rel="noopener" href="?state=allocation&lang=${lang}">${t('Open Order allocation','Άνοιγμα κατανομής παραγγελίας')}</a></div>`:''}<div class="goods-summary"><span>${picked().length} ${t('selected rows','επιλεγμένες γραμμές')}</span><strong class="mono" id="full-total">${mixed()?'—':money(sum())}</strong></div>`}

body=`<header class="page-head"><div>${btn('shipment','← Shipment DEMO-SHP-1042','← Αποστολή DEMO-SHP-1042','ghost')}<h1>${t('Shipment Invoice','Τιμολόγιο αποστολής')} <span class="mono">${heading}</span></h1><p>${t('Created 05-11-2026 · Last update 06-11-2026 · fixture timestamps','Δημιουργία 05-11-2026 · Ενημέρωση 06-11-2026 · δοκιμαστικές ημερομηνίες')}</p></div><span class="draft-badge">${isNew?t('Not saved','Μη αποθηκευμένο'):status==='draft'?t('Draft · no printed number','Πρόχειρο · χωρίς αριθμό'):status==='finalized'?t('Finalized · read-only','Οριστικοποιημένο · μόνο ανάγνωση'):t('Cancelled · read-only','Ακυρωμένο · μόνο ανάγνωση')}</span></header><div class="action-row">${editing?btn('cancel-edit','Cancel editing','Ακύρωση επεξεργασίας')+btn('save',isNew?'Create draft':'Save changes',isNew?'Δημιουργία πρόχειρου':'Αποθήκευση αλλαγών','primary',mixed()||conflict):status==='draft'?btn('edit','Edit draft','Επεξεργασία πρόχειρου')+btn('discard','Discard draft','Απόρριψη πρόχειρου')+btn('finalize','Finalize','Οριστικοποίηση','primary'):status==='finalized'&&role!=='operator'?btn('cancel-invoice','Cancel invoice','Ακύρωση τιμολογίου','danger'):status==='cancelled'?btn('replacement','Create replacement','Δημιουργία αντικατάστασης','primary'):''}</div>${notice?`<div class="alert info" role="status">${esc(notice)}</div>`:''}${conflict?card('!','This invoice changed elsewhere','Το τιμολόγιο άλλαξε αλλού',`<p>${marker(7)} ${t('Another operator saved a newer version. Your inputs remain below, but saving is blocked.','Άλλος χειριστής αποθήκευσε νεότερη έκδοση. Οι εισαγωγές σας διατηρούνται παρακάτω, αλλά η αποθήκευση έχει αποκλειστεί.')}</p><p>${t('Latest Notes: Updated by another operator. Your Notes:','Νεότερες σημειώσεις: Ενημέρωση από άλλον χειριστή. Οι σημειώσεις σας:')} <span id="local-note">${esc(form.notes)}</span></p>${btn('reload','Reload latest version','Φόρτωση τελευταίας έκδοσης')}`,fresh()):''}${status==='cancelled'||replacement?card('↔','Correction links','Σύνδεσμοι διόρθωσης',`${marker(6)} ${status==='cancelled'?`<p><strong>${t('Cancellation reason','Αιτία ακύρωσης')}:</strong> ${esc(reason)}</p><p>${t('Number and frozen contents are retained.','Ο αριθμός και τα οριστικοποιημένα στοιχεία διατηρούνται.')}</p>`:`<p>${t('Replacement for','Αντικατάσταση του')} ${btn('original','DEMO-INVOICE-0042','DEMO-INVOICE-0042','ghost')}</p>`}`,fresh()):''}${reviewPanel()}<div class="stack">${card(1,'Document','Έγγραφο',`<div class="shipment-summary"><div><strong>DEMO-SHP-1042</strong><p>${marker(1)} ${t('Shipment locked after creation · Greece → Netherlands','Κλειδωμένη αποστολή μετά τη δημιουργία · Ελλάδα → Ολλανδία')}</p></div></div><div class="grid three">${field('client','Client','Πελάτης','text',['DEMO Client A','DEMO Client B'])}${field('company','Invoicing company','Εταιρεία τιμολόγησης','text',form.client==='DEMO Client A'?['','DEMO Trading A','DEMO Trading A2']:['','DEMO Trading B'])}${field('type','Invoice type','Τύπος τιμολογίου','text',['Invoice','Commercial Invoice','Pro-forma Invoice','Shipping Invoice'])}${field('date','Document date','Ημερομηνία εγγράφου','date')}${field('subtitle','Subtitle (optional)','Υπότιτλος (προαιρετικό)')}</div><p class="small muted">${marker(2)} ${t('Saving a draft does not assign a printed number.','Η αποθήκευση πρόχειρου δεν εκχωρεί αριθμό εκτύπωσης.')}</p>`)}${card(2,'Parties','Συμβαλλόμενοι',`<div class="grid">${field('shipper','Shipper','Αποστολέας','area')}${field('consignee','Consignee','Παραλήπτης','area')}${field('agent','Agent','Πράκτορας','area')}${field('notify','Notify (optional)','Ειδοποίηση (προαιρετικό)','area')}</div>`)}${card(3,'Goods and full total','Αγαθά και πλήρες σύνολο',goods(),fresh())}${card(4,'Packing, weight and partial amount','Συσκευασία, βάρος και μερικό ποσό',`<div class="grid">${field('packing','Packing details','Στοιχεία συσκευασίας')}${field('weight','Total weight (kg)','Συνολικό βάρος (kg)','number')}${field('partial','Partial amount (optional)','Μερικό ποσό (προαιρετικό)','number')}${field('currency','Partial amount currency','Νόμισμα μερικού ποσού','text',['EUR','USD'])}</div><p class="small muted">${marker(4)} ${t('Manual values for the selected goods. The full total is calculated from source rows.','Χειροκίνητες τιμές για τα επιλεγμένα αγαθά. Το πλήρες σύνολο υπολογίζεται από τις γραμμές προέλευσης.')}</p>`)}${card(5,'Notes','Σημειώσεις',field('notes','Notes (optional)','Σημειώσεις (προαιρετικό)','area'))}</div><p class="small muted">${marker(5)} ${t('Printing and discounts are delivered separately.','Η εκτύπωση και οι εκπτώσεις παραδίδονται ξεχωριστά.')}</p>`}
root.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">FRONT LINE<small>OPERATIONS</small></div><div class="nav-label">${t('WORKSPACE','ΧΩΡΟΣ ΕΡΓΑΣΙΑΣ')}</div><div class="nav-item">${t('Orders','Παραγγελίες')}</div><div class="nav-item">${t('Shipments','Αποστολές')}</div><div class="nav-item active">${t('Shipment Invoices','Τιμολόγια αποστολών')}</div><div class="sidebar-foot">${t('Fictional data only','Μόνο δοκιμαστικά δεδομένα')}</div></aside><main class="main"><div class="topbar"><span class="breadcrumb">${t('Shipments / Invoice Details','Αποστολές / Στοιχεία τιμολογίου')}</span><div class="lang"><button id="en" class="${lang==='en'?'on':''}">EN</button><button id="el" class="${lang==='el'?'on':''}">EL</button></div></div><div class="content"><div class="preview-banner"><strong>${t('LOCAL DESIGN PREVIEW · Nothing is saved to the portal','ΤΟΠΙΚΗ ΠΡΟΕΠΙΣΚΟΠΗΣΗ · Τίποτα δεν αποθηκεύεται στην πύλη')}</strong><span>${t('Approved stacked cards','Εγκεκριμένες διαδοχικές κάρτες')}</span></div><section class="preview-tools"><div class="tools-row"><label for="scenario">${t('Scenario','Σενάριο')}</label><select id="scenario">${scenarios.map(([v,en,el])=>`<option value="${v}" ${state===v?'selected':''}>${t(en,el)}</option>`).join('')}</select><label for="role">${t('Preview role','Ρόλος προεπισκόπησης')}</label><select id="role"><option value="manager">${t('Manager / administrator','Υπεύθυνος / διαχειριστής')}</option><option value="operator" ${role==='operator'?'selected':''}>${t('Operator','Χειριστής')}</option></select>${btn('reset','Reset scenario','Επαναφορά σεναρίου','small')}</div><details><summary>${t('Business notes & new components','Επιχειρησιακοί κανόνες και νέα στοιχεία')}</summary><div class="notes-grid">${[[1,'Shipment stays locked after save.','Η αποστολή παραμένει κλειδωμένη μετά την αποθήκευση.'],[2,'Explicit save; incomplete drafts allowed; mixed currency blocks save.','Ρητή αποθήκευση· επιτρέπονται ημιτελή πρόχειρα· αποκλείονται διαφορετικά νομίσματα.'],[3,'Live draft rows; explicit selection and review of changes.','Τρέχουσες γραμμές πρόχειρου· ρητή επιλογή και έλεγχος αλλαγών.'],[4,'Packing, weight and partial amount are manual.','Συσκευασία, βάρος και μερικό ποσό είναι χειροκίνητα.'],[5,'Finalize assigns a number and freezes the saved document.','Η οριστικοποίηση εκχωρεί αριθμό και κλειδώνει το αποθηκευμένο έγγραφο.'],[6,'Cancellation requires a reason; replacement stays linked.','Η ακύρωση απαιτεί αιτία· η αντικατάσταση παραμένει συνδεδεμένη.'],[7,'Concurrent changes block overwrite and preserve local input.','Οι ταυτόχρονες αλλαγές αποκλείουν την αντικατάσταση και διατηρούν τοπικές εισαγωγές.']].map(([n,en,el])=>`<p>${marker(n)} ${t(en,el)}</p>`).join('')}</div><p>${fresh()} ${t('Goods table/totals, review panel and correction links compose existing portal primitives. Native controls and fallback fonts approximate the app.','Ο πίνακας αγαθών/συνόλων, ο πίνακας ελέγχου και οι σύνδεσμοι διόρθωσης συνθέτουν υπάρχοντα στοιχεία. Τα εγγενή χειριστήρια και οι εναλλακτικές γραμματοσειρές προσεγγίζουν την εφαρμογή.')}</p></details></section>${body}</div></main></div>`;bind()}
const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn};

document.querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>{const key=el.dataset.field,old=form[key],value=el.value;form[key]=value;dirty=true;if(['packing','weight','partial'].includes(key)&&replacement)needsReview=true;if(key==='client'&&old!==value){form.company='';render()}else if(key==='company'&&old!==value){const newText=value?value+'\n10 Example Road, Demo City':'';if(form.shipper!==old+'\n10 Example Road, Demo City'&&form.shipper.trim()){modal(t('Replace Shipper text?','Αντικατάσταση κειμένου αποστολέα;'),`<p>${t('Shipper contains edited text. Back keeps your text; Replace uses the company details.','Ο αποστολέας περιέχει επεξεργασμένο κείμενο. Πίσω διατηρεί το κείμενό σας· Αντικατάσταση χρησιμοποιεί τα στοιχεία εταιρείας.')}</p>`,t('Replace with company details','Αντικατάσταση με στοιχεία εταιρείας'),()=>{form.shipper=newText;render()})}else{form.shipper=newText;render()}}});

on('refresh',()=>{if(!refreshed){rows[0].amount=660;rows.push({id:'r4',order:'DEMO-PO-2190',name:'New eligible valve',hs:'8481',qty:1,unit:'PCS',amount:95,currency:'EUR'});refreshed=true;needsReview=true}report(t('Goods refreshed. Document fields and eligible selections retained. New rows are unselected.','Τα αγαθά ανανεώθηκαν. Διατηρήθηκαν πεδία και επιλέξιμες επιλογές. Οι νέες γραμμές δεν επιλέχθηκαν.'))});

on('save',()=>{if(conflict||mixed())return;if(saveFailure){report(t('Save failed. Your changes are retained. Retry when ready.','Η αποθήκευση απέτυχε. Οι αλλαγές διατηρούνται. Δοκιμάστε ξανά.'));saveFailure=false;return}saved=clone(form);dirty=false;editing=false;isNew=false;report(t('Draft saved in this simulation. No printed number assigned.','Το πρόχειρο αποθηκεύτηκε στην προσομοίωση. Δεν εκχωρήθηκε αριθμός.'))});
on('finalize',()=>{if(required().length||!picked().length||mixed()||needsReview||missing||dirty){modal(t('Complete these checks','Ολοκληρώστε τους ελέγχους'),`<p>${t('Edit and save the draft to resolve:','Επεξεργαστείτε και αποθηκεύστε το πρόχειρο για επίλυση:')}</p><ul>${required().map(k=>`<li>${esc({agent:t('Agent is required','Απαιτείται πράκτορας'),client:t('Client is required','Απαιτείται πελάτης'),company:t('Invoicing company is required','Απαιτείται εταιρεία τιμολόγησης'),type:t('Invoice type is required','Απαιτείται τύπος'),date:t('Date is required','Απαιτείται ημερομηνία'),shipper:t('Shipper is required','Απαιτείται αποστολέας'),consignee:t('Consignee is required','Απαιτείται παραλήπτης'),packing:t('Packing details are required','Απαιτείται συσκευασία'),weight:t('Weight is required','Απαιτείται βάρος')}[k])}</li>`).join('')}${!picked().length?`<li>${t('Select eligible goods','Επιλέξτε επιλέξιμα αγαθά')}</li>`:''}${needsReview||missing?`<li>${t('Complete the source and packing review','Ολοκληρώστε τον έλεγχο προέλευσης και συσκευασίας')}</li>`:''}${mixed()?`<li>${t('Resolve mixed currencies','Επιλύστε τα διαφορετικά νομίσματα')}</li>`:''}${dirty?`<li>${t('Save the reviewed changes','Αποθηκεύστε τις ελεγμένες αλλαγές')}</li>`:''}</ul>`,t('Edit draft','Επεξεργασία πρόχειρου'),()=>{editing=true;render()});return}modal(t('Finalize this invoice?','Οριστικοποίηση τιμολογίου;'),`<p>${marker(5)} ${t('A printed number will be assigned and the saved document will be frozen. Corrections require cancellation and replacement.','Θα εκχωρηθεί αριθμός και το αποθηκευμένο έγγραφο θα κλειδωθεί. Οι διορθώσεις απαιτούν ακύρωση και αντικατάσταση.')}</p><p class="mono">DEMO-SHP-1042</p><p>${esc(form.client)} · ${esc(form.company)}</p><ul>${picked().map(r=>`<li>${esc(r.name)} · ${r.qty} ${r.unit} · ${r.amount.toFixed(2)} ${r.currency}</li>`).join('')}</ul><strong>${money(sum())}</strong><p class="small">${t('Simulation: DEMO-INVOICE-0042, not a real sequence number.','Προσομοίωση: DEMO-INVOICE-0042, όχι πραγματικός αριθμός σειράς.')}</p>`,t('Finalize invoice','Οριστικοποίηση τιμολογίου'),()=>{status='finalized';state='finalized';report(t('Finalized in simulation. Values are frozen.','Οριστικοποιήθηκε στην προσομοίωση. Οι τιμές κλειδώθηκαν.'))})});
on('discard',()=>modal(t('Discard this draft?','Απόρριψη πρόχειρου;'),'<p class="mono">DEMO-DRAFT-0087 · DEMO-SHP-1042</p>',t('Discard draft','Απόρριψη πρόχειρου'),()=>{dirty=false;state='shipment';render()},true));
on('cancel-invoice',()=>modal(t('Cancel finalized invoice','Ακύρωση οριστικοποιημένου τιμολογίου'),`<p>${t('The number and frozen contents remain in the record.','Ο αριθμός και τα οριστικοποιημένα στοιχεία παραμένουν στο αρχείο.')}</p><label for="reason">${t('Cancellation reason (required)','Αιτία ακύρωσης (υποχρεωτικό)')}</label><textarea id="reason" required></textarea><p id="reason-error" role="alert"></p>`,t('Cancel invoice','Ακύρωση τιμολογίου'),()=>{const v=document.getElementById('reason').value.trim();if(!v){document.getElementById('reason-error').textContent=t('Enter a reason.','Συμπληρώστε αιτία.');document.getElementById('reason').focus();return false}reason=v;status='cancelled';state='cancelled';render()},true));
on('replacement',()=>{const previous=clone(form);reset('replacement');form={...previous,date:today(),selected:previous.selected.filter(id=>rows.some(r=>r.id===id&&!r.unavailable))};saved=clone(form);render()});on('original',()=>leave(()=>reset('cancelled')));on('reload',()=>modal(t('Reload and discard local edits?','Επαναφόρτωση και απόρριψη τοπικών αλλαγών;'),`<p>${t('Copy any local text you need before continuing.','Αντιγράψτε όποιο τοπικό κείμενο χρειάζεστε πριν συνεχίσετε.')}</p><pre>${esc(JSON.stringify(form,null,2))}</pre>`,t('Reload latest','Φόρτωση τελευταίας έκδοσης'),()=>{reset('default');form.notes='Updated by another operator.';saved=clone(form);render()},true));
}
let originalRecord=null,replacementRecord=null,reviewWasConfirmed=false;
const capture=()=>clone({form,saved,rows,editing,dirty,status,needsReview,missing,conflict,replacement,isNew,notice,reason,refreshed,saveFailure,state});
function restore(record){({form,saved,rows,editing,dirty,status,needsReview,missing,conflict,replacement,isNew,notice,reason,refreshed,saveFailure,state}=clone(record));render()}
const bindBase=bind;
bind=function(){bindBase();
 on('review',()=>{needsReview=false;reviewWasConfirmed=true;dirty=true;editing=true;report(t('Review confirmed. Save the reviewed draft before finalizing.','Ο έλεγχος επιβεβαιώθηκε. Αποθηκεύστε το πρόχειρο πριν την οριστικοποίηση.'))});
 document.querySelectorAll('[data-row],[data-group],#packing,#weight,#partial,#currency').forEach(el=>el.addEventListener('change',()=>{if(reviewWasConfirmed){needsReview=true;render()}}));
 on('replacement',()=>{originalRecord=capture();const previous=clone(form);reset('replacement');form={...previous,date:today(),selected:previous.selected.filter(id=>rows.some(r=>r.id===id&&!r.unavailable))};saved=clone(form);render()});
 on('original',()=>leave(()=>{replacementRecord=capture();replacementRecord.editing=false;replacementRecord.dirty=false;replacementRecord.form=clone(saved);if(originalRecord)restore(originalRecord);else reset('cancelled')}));
 if(status==='cancelled'&&replacementRecord&&!replacementRecord.isNew){const container=document.querySelector('.action-row');container.insertAdjacentHTML('beforeend',btn('linked-replacement','Open replacement draft','Άνοιγμα πρόχειρου αντικατάστασης'));on('linked-replacement',()=>restore(replacementRecord))}
};
const resetBase=reset;
reset=function(s){reviewWasConfirmed=false;resetBase(s)};
window.addEventListener('beforeunload',e=>{if(dirty||isNew){e.preventDefault();e.returnValue=''}});
reset(state);

</script></body></html>
<style>@media(max-width:650px){.preview-tools .tools-row{display:grid;grid-template-columns:1fr}.preview-tools .tools-row select{width:100%;max-width:100%}}</style>
