<style>

*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--fg);font:14px/1.6 'Plus Jakarta Sans','Segoe UI',sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--strong);border-radius:8px;background:var(--surface);min-height:40px;padding:8px 14px;font-weight:600}button:hover{background:var(--canvas)}button:disabled{opacity:.5;cursor:not-allowed}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.danger{background:#d33c3c;color:white}input,select{height:40px;width:100%;border:1px solid var(--border);border-radius:8px;padding:0 12px;background:var(--surface)}input:disabled{background:var(--surface-2);color:var(--muted)}textarea{width:100%;min-height:80px;border:1px solid var(--border);border-radius:8px;padding:8px 12px}label,.label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}h1{font-size:20px;line-height:28px;margin:0}h2{font-size:16px;margin:0}h3{font-size:15px;margin:0}p{margin:8px 0}small,.muted{color:var(--muted)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.review{padding:20px 28px;background:var(--surface);border-bottom:1px solid var(--border)}.toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-top:16px}.toolbar label{margin:0;min-width:140px}.toolbar select{margin-top:6px}.toolbar button[aria-pressed=true]{border-color:var(--accent);color:var(--accent-active);background:#e1f5ee}.compare{padding:24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.compare.single{grid-template-columns:minmax(0,1fr);max-width:1440px;margin:auto}.artboard{min-width:0}.artboard>header{padding:16px 0;min-height:130px}.artboard>header p{font-size:13px}.frame{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--canvas)}.chrome{background:var(--fg);color:white;padding:14px 20px;display:flex;justify-content:space-between;gap:12px}.shell{display:grid;grid-template-columns:150px minmax(0,1fr)}aside{background:var(--fg);color:#9db6d4;padding:16px 12px}aside div{padding:10px 8px}aside .active{background:#16365f;color:white;border-radius:8px}main{padding:20px;min-width:0}.heading,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--info-bg);color:var(--info);font-weight:600}.dg{background:var(--danger-bg);color:var(--danger)}.status{background:#f3e8ff;color:#5b21b6;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}.late{background:#eef2ff;color:#3730a3}.tabs{display:flex;overflow:auto;border-bottom:1px solid var(--border);margin:16px 0;gap:4px}.tabs button{border:0;border-radius:0;background:transparent;white-space:nowrap;font-weight:400;border-bottom:2px solid transparent}.tabs button.active{color:var(--accent-active);border-color:var(--accent);font-weight:600}.card{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:20px;box-shadow:var(--shadow);margin-bottom:20px}.card>.row{margin-bottom:16px}.subcard{border:1px solid var(--border);border-radius:8px;padding:16px;background:var(--surface-2);margin:16px 0}.subcard .row+ .row{margin-top:16px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 24px}.b .grid,.current .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.field{min-width:0}.value{overflow-wrap:anywhere;min-height:40px;padding:8px 0}.customs{display:grid;grid-template-columns:1fr 1fr;gap:24px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:20px 0;margin:20px 0}.mono{font-family:'JetBrains Mono',Consolas,monospace}.note{font-size:12px;color:var(--info);background:var(--info-bg);padding:10px 12px;border-radius:8px}.new{display:inline-block;font-size:11px;color:var(--info);border:1px dashed #2b7fd4;padding:2px 6px;border-radius:6px;margin:4px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:12px;white-space:normal}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.current .label{text-transform:uppercase;color:#9aa3b0;letter-spacing:.05em}.current .overview{display:grid;grid-template-columns:1fr 1fr;gap:20px}.current .overview .card{min-width:0}.current .grid{gap:16px}.state{padding:40px 20px;text-align:center}.comparison-note{max-width:1000px;padding:0 28px 24px}.two-notes{display:grid;gap:16px}.samplelink{border:0;color:var(--accent-active);padding:0;background:none;min-height:32px}.current .tabs button{font-size:12px}dialog{border:1px solid var(--border);border-radius:16px;padding:24px;max-width:min(520px,calc(100vw - 32px));color:var(--fg);box-shadow:0 24px 48px -12px rgb(6 20 37 / .28)}dialog::backdrop{background:rgb(6 20 37 / .5)}dialog .footer{flex-wrap:wrap}.compare:not(.single) .shell{grid-template-columns:1fr}.compare:not(.single) aside{display:none}.compare:not(.single) .grid,.compare:not(.single) .current .overview{grid-template-columns:1fr 1fr}.compare:not(.single) .current .overview{display:block}#announcement{padding:0 28px;color:var(--accent-active)}
@media(max-width:1100px){.compare{grid-template-columns:1fr}.shell{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.artboard>header{min-height:auto}.current .overview{display:block}}
@media(max-width:600px){.review{padding:16px}.compare{padding:12px}.grid,.b .grid,.current .grid,.customs,.compare:not(.single) .grid{grid-template-columns:1fr}main{padding:12px}.card{padding:20px}.toolbar{gap:8px}.toolbar label{width:100%}.chrome{padding:12px}.comparison-note{padding:16px}.footer button{flex:1}.tabs{max-width:100%}.subcard{padding:12px}}

</style></head><body>
<header class="review"><h1>FRO-326 · <span data-en="Local design comparison" data-el="Τοπική σύγκριση σχεδιασμού"></span></h1><p data-en="Fictional fixtures · Static component mirrors · No server writes or emails. The ticket will define behavior; this canvas compares the look." data-el="Εικονικά δεδομένα · Στατικά πρότυπα στοιχείων · Χωρίς αποθήκευση ή email. Το ticket ορίζει τη λειτουργία· εδώ συγκρίνουμε την εμφάνιση."></p>
<div class="toolbar"><button id="lang">Ελληνικά</button><button data-view="all" data-en="Compare" data-el="Σύγκριση">Compare</button><button data-view="current" data-en="Current" data-el="Τρέχουσα">Current</button><button data-view="a" data-en="A · Four columns" data-el="Α · Τέσσερις στήλες">A · Four columns</button><button data-view="b" data-en="B · Two columns" data-el="Β · Δύο στήλες">B · Two columns</button><label><span data-en="Fixture" data-el="Παράδειγμα"></span><select id="scenario"><option value="early" data-en="Early stage" data-el="Αρχικό στάδιο">Early stage</option><option value="late" data-en="Shipped · restricted editing" data-el="Σε μεταφορά · περιορισμένη επεξεργασία">Shipped · restricted editing</option></select></label><label><span data-en="Page state" data-el="Κατάσταση σελίδας"></span><select id="state"><option value="default" data-en="Default" data-el="Κανονική">Default</option><option value="loading" data-en="Loading" data-el="Φόρτωση">Loading</option><option value="empty" data-en="Unavailable record" data-el="Μη διαθέσιμη εγγραφή">Unavailable record</option><option value="error" data-en="Error" data-el="Σφάλμα">Error</option></select></label></div></header>
<p id="announcement" role="status"></p><div id="boards" class="compare"></div>
<section class="comparison-note"><h2 data-en="What changed" data-el="Τι άλλαξε"></h2><p data-en="Both options use comfortable density, 12px sentence-case labels, 40px controls, 8px control corners and 12px cards. A is more compact on wide screens; B gives values more room. Both stack on phones. Overview and Available actions are the focus of this comparison; other tabs remain labelled scope references." data-el="Και οι δύο επιλογές χρησιμοποιούν άνετη πυκνότητα, ετικέτες 12px, πεδία 40px και ακτίνες 8px/12px. Η Α είναι πιο συμπαγής· η Β δίνει περισσότερο χώρο. Στο κινητό εμφανίζονται σε μία στήλη. Η σύγκριση εστιάζει στην Επισκόπηση και τις Διαθέσιμες ενέργειες."></p><p data-en="New component: the restricted-edit chooser composes existing Modal, Select and Button primitives. It allows one correction per session. Draft-discard confirmation also uses the existing Modal. No new primitive is proposed." data-el="Νέο στοιχείο: επιλογή περιορισμένης διόρθωσης με τα υπάρχοντα Modal, Select και Button. Μία διόρθωση ανά επεξεργασία. Η επιβεβαίωση απόρριψης χρησιμοποιεί επίσης Modal. Δεν προτείνεται νέο βασικό στοιχείο."></p><small>Source: Frontline-Forwarding/frontline-forwarding · 3820e89 · DESIGN.md / theme.css / shared UI components. Current reference is a source-based illustration, not a live screenshot. System font fallback is used if the named fonts are unavailable.</small></section>
<dialog id="modal" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-actions" class="footer"></div></dialog>
<script>
const params=new URLSearchParams(location.search);let lang=params.get('lang')==='el'?'el':'en',view=params.get('view')||'all',scenario=params.get('scenario')==='late'?'late':'early',pageState=['loading','empty','error'].includes(params.get('state'))?params.get('state'):'default';
const sessions={a:{tab:0,mode:null,dirty:false,pickup:'',alk:'123456',invoice:'Fixture Invoice A',reference:'DEMO-REF-01'},b:{tab:0,mode:null,dirty:false,pickup:'',alk:'123456',invoice:'Fixture Invoice A',reference:'DEMO-REF-01'}};
const t=(en,el)=>lang==='en'?en:el;const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=()=>[t('Overview','Επισκόπηση'),t('Collis','Κόλλι'),t('Invoice rows','Γραμμές τιμολογίου'),t('History & activity','Ιστορικό & δραστηριότητα'),t('Documents','Έγγραφα'),t('Available actions','Διαθέσιμες ενέργειες')];
function field(id,label,value,key,editable=false){let s=sessions[id];return `<div class="field"><label for="${id}-${key}">${label}</label>${editable?`<input id="${id}-${key}" data-key="${key}" data-board="${id}" value="${esc(value)}">`:`<div class="value" id="${id}-${key}">${esc(value||'—')}</div>`}</div>`}
function modal(title,body,buttons){let d=document.querySelector('#modal');document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-body').innerHTML=body;let a=document.querySelector('#dialog-actions');a.replaceChildren();buttons.forEach(([label,fn,cls])=>{let b=document.createElement('button');b.textContent=label;b.className=cls||'';b.onclick=()=>{d.close();fn?.()};a.append(b)});d.showModal()}
function announce(message){document.querySelector('#announcement').textContent=message}
function leave(id){let s=sessions[id];if(s?.dirty){modal(t('Discard unsaved changes?','Απόρριψη μη αποθηκευμένων αλλαγών;'),`<p>${t('Leaving this Order discards its open drafts. Switching tabs or language keeps them.','Η έξοδος απορρίπτει τις ανοιχτές αλλαγές. Η αλλαγή καρτέλας ή γλώσσας τις διατηρεί.')}</p>`,[[t('Keep editing','Συνέχεια επεξεργασίας')],[t('Discard and leave','Απόρριψη και έξοδος'),()=>{reset(id);render();announce(t('Navigation simulated. No record changed.','Προσομοίωση πλοήγησης. Καμία αλλαγή εγγραφής.'))},'danger']])}else announce(t('Navigation simulated. No record changed.','Προσομοίωση πλοήγησης. Καμία αλλαγή εγγραφής.'))}
function reset(id){Object.assign(sessions[id],{mode:null,dirty:false,pickup:'',alk:'123456',invoice:'Fixture Invoice A',reference:'DEMO-REF-01'})}
function edit(id){let s=sessions[id];if(scenario==='late'){modal(t('Choose a correction','Επιλογή διόρθωσης'),`<span class="new">${t('New component','Νέο στοιχείο')}</span><p>${t('One correction per session. All unrelated fields stay locked.','Μία διόρθωση ανά επεξεργασία. Τα υπόλοιπα πεδία παραμένουν κλειδωμένα.')}</p>`,[[t('Cancel','Ακύρωση')],[t('Invoice company','Εταιρεία τιμολόγησης'),()=>{s.mode='invoice';render()}],[t('ΑΛΚ','ΑΛΚ'),()=>{s.mode='alk';render()}]])}else{s.mode='ordinary';render()}}
function save(id){let s=sessions[id];modal(t('Review local changes','Έλεγχος τοπικών αλλαγών'),`<p>${t('This is a visual review only. Production must obtain the authorized impact and validation result before saving.','Οπτικός έλεγχος μόνο. Η παραγωγή πρέπει να λάβει τον εξουσιοδοτημένο έλεγχο επιπτώσεων και εγκυρότητας πριν την αποθήκευση.')}</p><p>${s.mode==='alk'?t('ΑΛΚ correction: show all affected Orders in the shared registration before confirmation.','Διόρθωση ΑΛΚ: εμφάνιση όλων των επηρεαζόμενων παραγγελιών πριν την επιβεβαίωση.'):s.mode==='invoice'?t('Invoice company: show protected-document conflicts and the proposed regrouping before confirmation.','Εταιρεία τιμολόγησης: εμφάνιση συγκρούσεων εγγράφων και αναομαδοποίησης πριν την επιβεβαίωση.'):t('Readiness or customs changes may require their own review, even when status is unchanged.','Αλλαγές ετοιμότητας ή τελωνειακού καθεστώτος μπορεί να απαιτούν έλεγχο ακόμη και χωρίς αλλαγή κατάστασης.')}</p>`,[[t('Back to editing','Επιστροφή στην επεξεργασία')],[t('Finish demonstration','Τέλος επίδειξης'),()=>{s.mode=null;s.dirty=false;render();announce(t('Local demonstration completed; nothing was persisted.','Η τοπική επίδειξη ολοκληρώθηκε· δεν αποθηκεύτηκε τίποτα.'))},'primary']])}
function status(id){return `<div class="subcard"><div class="row"><h3>${t('Order status','Κατάσταση παραγγελίας')}</h3><div class="actions"><button disabled>${t('Request readiness date','Αίτημα ημερομηνίας')}</button><button disabled>${t('Confirm readiness date','Επιβεβαίωση ημερομηνίας')}</button></div></div><div class="row"><span class="status ${scenario==='late'?'late':''}">● ${scenario==='late'?t('Shipped','Σε μεταφορά'):t('Received readiness date','Λήφθηκε ημερομηνία ετοιμότητας')}</span><button data-action="demo" class="primary">${scenario==='late'?t('Open shipment','Άνοιγμα αποστολής'):t('Mark ready at supplier','Έτοιμα στον προμηθευτή')}</button></div><p class="muted">${scenario==='late'?t('Readiness emails are not applicable after shipment.','Τα email ετοιμότητας δεν εφαρμόζονται μετά την αποστολή.'):t('Email controls are disabled in this layout-only comparison.','Τα email είναι ανενεργά σε αυτή την οπτική σύγκριση.')}</p></div>`}
function overview(id){let s=sessions[id],ordinary=s.mode==='ordinary';return `<section class="card"><div class="row"><h2>${t('Order details','Στοιχεία παραγγελίας')}</h2>${s.mode?`<span class="badge">${t('Editing','Επεξεργασία')}</span>`:`<button data-action="edit">${t('Edit','Επεξεργασία')}</button>`}</div>${scenario==='late'?`<span class="new">${t('New component · restricted-edit chooser','Νέο στοιχείο · επιλογή διόρθωσης')}</span><p class="note">${t('Invoice company or ΑΛΚ only. One correction per session.','Μόνο εταιρεία τιμολόγησης ή ΑΛΚ. Μία διόρθωση ανά επεξεργασία.')}</p>`:''}${status(id)}<div class="grid">${field(id,t('Client','Πελάτης'),'Fixture Client A','client')}${field(id,t('Vessel','Πλοίο'),'Fixture Vessel A','vessel')}${field(id,t('Current warehouse','Τρέχουσα αποθήκη'),'DEMO-WH · A-01','warehouse')}${field(id,t('Supplier','Προμηθευτής'),'Fixture Supplier A','supplier')}${field(id,t('Invoice company','Εταιρεία τιμολόγησης'),s.invoice,'invoice',s.mode==='invoice')}${field(id,t('Owner reference','Αναφορά πελάτη'),s.reference,'reference',ordinary)}${field(id,t('Expected readiness date','Αναμενόμενη ετοιμότητα'),'22/10/2026','date')}${field(id,t('Greece','Ελλάδα'),t('Yes','Ναι'),'greece')}<div class="field"><label for="${id}-pickup">${t('Pickup responsibility','Ευθύνη παραλαβής')}</label>${ordinary?`<select id="${id}-pickup" data-board="${id}" data-key="pickup"><option value="" ${!s.pickup?'selected':''}>${t('Not recorded','Δεν έχει καταγραφεί')}</option><option value="yes" ${s.pickup==='yes'?'selected':''}>${t('Yes','Ναι')}</option><option value="no" ${s.pickup==='no'?'selected':''}>${t('No','Όχι')}</option></select>`:`<div class="value">${s.pickup==='yes'?t('Yes','Ναι'):s.pickup==='no'?t('No','Όχι'):'—'}</div>`}<small>${t('Unset is not No.','Το κενό δεν σημαίνει Όχι.')}</small></div>${field(id,'DN Import','DEMO-IN-01','dnin')}${field(id,'DN Export','—','dnout')}${field(id,t('Supplier reference','Αναφορά προμηθευτή'),'DEMO-SUP-01','supref')}</div><div class="customs">${field(id,t('Customs regime','Τελωνειακό καθεστώς'),'Τελωνειακή Αποταμίευση','regime')}${field(id,'ΑΛΚ',s.alk,'alk',s.mode==='alk')}</div><p class="muted">${t('Current regime is explicit. No legacy Bonded flag is used to infer it.','Το τρέχον καθεστώς είναι ρητό. Δεν προκύπτει από παλιές ενδείξεις Bonded.')}</p>${field(id,t('Urgent information','Πληροφορίες επείγοντος'),'—','urgent')}${s.mode?`<div class="footer"><button data-action="cancel">${t('Cancel','Ακύρωση')}</button><button data-action="save" class="primary">${t('Review changes','Έλεγχος αλλαγών')}</button></div>`:''}</section><section class="card"><h2>${t('Notes','Σημειώσεις')}</h2><div class="two-notes"><div><h3>${t('Internal notes','Εσωτερικές σημειώσεις')}</h3><p>${t('Fixture: check handling instructions before collection.','Παράδειγμα: έλεγχος οδηγιών πριν την παραλαβή.')}</p></div><div><h3>${t('External notes','Εξωτερικές σημειώσεις')}</h3><p>—</p></div></div></section><section class="card"><h2>${t('Split relationships','Σχέσεις διαχωρισμών')}</h2><p>${t('Root Order','Αρχική παραγγελία')}: <button class="samplelink" data-action="leave">DEMO-PO-001</button></p></section>`}
function current(){return `<section class="card"><div class="row"><h1 class="mono">DEMO-PO-001</h1><span class="status">● ${t('Expected readiness','Αναμενόμενη ετοιμότητα')}</span><span class="badge dg">DG</span><span class="badge">Bonded</span><button data-action="demo">${t('Edit purchase order','Επεξεργασία παραγγελίας')}</button></div><p>Fixture Client A · Fixture Vessel A</p></section><div class="tabs"><button class="active">${t('Overview','Επισκόπηση')}</button><button>${t('Collis','Κόλλι')}</button><button>${t('Available actions','Διαθέσιμες ενέργειες')}</button></div><div class="overview"><section class="card"><h2>${t('Overview','Επισκόπηση')}</h2><div class="grid">${[['Client','Fixture Client A'],['Supplier','Fixture Supplier A'],['Invoice company','Fixture Invoice A'],['Collection agent','—'],['Owner reference','DEMO-REF-01'],['Supplier reference','DEMO-SUP-01'],['Message number','—'],['Readiness','22/10/2026'],['Route','—'],['Notes','—']].map(([k,v])=>`<div><div class="label">${esc(k)}</div><div>${esc(v)}</div></div>`).join('')}</div></section><section class="card"><h2>${t('Split lineage','Γενεαλογία διαχωρισμών')}</h2><p>Root PO · DEMO-PO-001</p><p>Parent PO · —</p></section></div>`}
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[lang]);document.querySelector('#lang').textContent=lang==='en'?'Ελληνικά':'English';document.querySelector('#scenario').value=scenario;document.querySelector('#state').value=pageState;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));let boards=document.querySelector('#boards');boards.className='compare'+(view==='all'?'':' single');boards.innerHTML=['current','a','b'].filter(id=>view==='all'||id===view).map(id=>{let s=sessions[id];let title=id==='current'?t('Current production structure','Τρέχουσα δομή παραγωγής'):id==='a'?t('A · Four-column details','Α · Τέσσερις στήλες'):t('B · Two-column details','Β · Δύο στήλες');let note=id==='current'?t('Source-based Overview reference. Existing fields are shown for comparison only.','Επισκόπηση από τον πηγαίο κώδικα. Τα παλιά πεδία εμφανίζονται μόνο για σύγκριση.'):id==='a'?t('Recommended: efficient scanning on wide screens. Same comfortable control sizes.','Πρόταση: γρήγορη ανάγνωση σε μεγάλη οθόνη. Άνετα πεδία ίδιου μεγέθους.'):t('More room for long labels and references; a longer page. Same rules and controls.','Περισσότερος χώρος για ετικέτες και αναφορές· μεγαλύτερη σελίδα. Ίδιοι κανόνες και πεδία.');let content=pageState!=='default'?`<section class="card state"><h2>${pageState==='loading'?t('Loading Order…','Φόρτωση παραγγελίας…'):pageState==='empty'?t('Order unavailable','Η παραγγελία δεν είναι διαθέσιμη'):t('Order could not be loaded','Αδυναμία φόρτωσης παραγγελίας')}</h2>${pageState==='error'?`<button data-action="retry">${t('Retry','Επανάληψη')}</button>`:''}</section>`:id==='current'?current():`<div class="heading"><h1>${t('Order','Παραγγελία')} · <span class="mono">DEMO-PO-001</span></h1><div class="badges"><span class="badge dg">DG</span><span class="badge">${t('Parent balance','Υπόλοιπο γονικής')}</span></div></div><div class="tabs">${tabs().map((x,i)=>`<button data-tab="${i}" class="${s.tab===i?'active':''}">${x}</button>`).join('')}</div>${s.tab===0?overview(id):s.tab===5?[t('Request readiness date','Αίτημα ημερομηνίας ετοιμότητας'),t('Confirm readiness date','Επιβεβαίωση ημερομηνίας ετοιμότητας'),t('Create supplier invoice','Δημιουργία τιμολογίου προμηθευτή'),t('Entry Note','Δελτίο Εισόδου')].map(x=>`<section class="card"><h2>${x}</h2><p class="muted">${t('Layout reference · production eligibility comes from the linked contract.','Οπτική αναφορά · η διαθεσιμότητα ορίζεται από το σχετικό ticket.')}</p><button data-action="demo">${x}</button></section>`).join(''):`<section class="card"><h2>${tabs()[s.tab]}</h2><p>${t('Retained scope. Detailed interactions will be included in the selected-direction preview.','Το περιεχόμενο διατηρείται. Οι λεπτομέρειες θα περιληφθούν στην προεπισκόπηση της επιλεγμένης κατεύθυνσης.')}</p></section>`}`;return `<article class="artboard ${id}" data-id="${id}"><header><h2>${title}</h2><p>${note}</p>${id!=='current'?`<span class="new">${t('New component: restricted-edit chooser','Νέο στοιχείο: επιλογή διόρθωσης')}</span>`:''}</header><div class="frame"><div class="chrome"><strong>Frontline</strong><span>${t('Console','Κονσόλα')}</span></div><div class="shell"><aside><div>${t('Dashboard','Πίνακας ελέγχου')}</div><div class="active">${t('Purchase orders','Παραγγελίες')}</div><div>${t('Shipments','Αποστολές')}</div><div>${t('Warehouses','Αποθήκες')}</div></aside><main>${id!=='current'?`<button data-action="leave">← ${t('Back to Orders','Επιστροφή στις παραγγελίες')}</button>`:''}${content}</main></div></div></article>`}).join('')}
document.addEventListener('input',e=>{if(e.target.dataset.key){let s=sessions[e.target.dataset.board];s[e.target.dataset.key]=e.target.value;s.dirty=true}});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();return}let id=b.closest('[data-id]')?.dataset.id,action=b.dataset.action;if(b.dataset.tab!==undefined){sessions[id].tab=Number(b.dataset.tab);render()}if(action==='edit')edit(id);if(action==='cancel'){reset(id);render()}if(action==='save')save(id);if(action==='leave')leave(id);if(action==='retry'){pageState='default';render()}if(action==='demo')announce(t('Design-only action. No navigation, save or email was performed.','Ενέργεια επίδειξης. Δεν έγινε πλοήγηση, αποθήκευση ή email.'))});
document.querySelector('#lang').onclick=()=>{lang=lang==='en'?'el':'en';render()};document.querySelector('#scenario').onchange=e=>{if(Object.values(sessions).some(s=>s.dirty)){e.target.value=scenario;announce(t('Finish or cancel the open draft before changing the review fixture.','Ολοκληρώστε ή ακυρώστε τις αλλαγές πριν αλλάξετε παράδειγμα.'));return}scenario=e.target.value;Object.keys(sessions).forEach(reset);render()};document.querySelector('#state').onchange=e=>{pageState=e.target.value;render()};window.addEventListener('beforeunload',e=>{if(Object.values(sessions).some(s=>s.dirty)){e.preventDefault();e.returnValue=''}});render();
</script></body></html>
