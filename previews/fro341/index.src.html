/* ---------------- Derived ---------------- */
const isArr = () => S.status === 'ARRIVED';
const whById = id => WAREHOUSES.find(w => w.id === id);
const cityName = id => CITIES.find(c => c.id === id)?.name ?? '';

const eligibleOrders = () => {
  if (S.ui === 'empty' || !S.originWh) return [];
  const q = S.search.trim().toLowerCase();
  return allOrders().filter(o => o.wh === S.originWh && ['IN_STOCK','READY','EXPECTED_READINESS'].includes(o.status))
    .filter(o => !q || [o.id, o.vessel, o.client, ...o.collis.map(c => c.id)].join(' ').toLowerCase().includes(q));
};
const histOrders = () => (S.ui === 'empty' || !S.dest) ? [] : HIST_ORDERS.filter(o => o.recv === S.dest);
const selectedCount = o => o.collis.filter(c => S.sel.has(c.id)).length;
const participating = () => isArr() ? HIST_ORDERS.filter(o => S.histSel.has(o.id)) : allOrders().filter(o => selectedCount(o) > 0);
const partialOrders = () => isArr() ? [] : allOrders().filter(o => o.status === 'IN_STOCK' && selectedCount(o) > 0 && selectedCount(o) < o.collis.length);
const sourcesForOrigin = () => {
  if (S.ui === 'empty' || !S.originWh) return [];
  const q = S.srcSearch.trim().toLowerCase();
  return SOURCES.filter(s => s.dest === S.originWh).filter(s => !q || (s.id + ' ' + s.doc).toLowerCase().includes(q));
};
const findColli = id => { for (const o of allOrders()) { const c = o.collis.find(x => x.id === id); if (c) return {o, c}; } return null; };

function validation() {
  const v = {};
  const arr = isArr();
  if (arr) {
    v.geo = !!(S.dc && S.dcity) && (!S.ocity || CITIES.find(c => c.id === S.ocity)?.country === S.oc) && (!S.originWh || (S.ocity && whById(S.originWh)?.city === S.ocity));
  } else {
    v.geo = !!(S.oc && S.ocity && S.dc && S.dcity);
  }
  const ow = whById(S.originWh), dw = whById(S.dest);
  if (arr) v.route = !!dw && dw.city === S.dcity && S.purpose === 'NETWORK_TRANSFER';
  else {
    v.route = !!ow && ow.city === S.ocity && !!S.mode;
    if (S.purpose === 'NETWORK_TRANSFER') v.route = v.route && !!dw && dw.city === S.dcity;
    else if (S.purpose === 'DELIVERY_TO_VESSEL') v.route = v.route && new Set(participating().map(o => o.vessel)).size === 1;
    else v.route = v.route && !!S.dest;
  }
  v.vesselError = !arr && S.purpose === 'DELIVERY_TO_VESSEL' && new Set(participating().map(o => o.vessel)).size > 1;
  v.selection = arr ? S.histSel.size > 0 : S.sel.size > 0;
  v.partial = partialOrders().every(o => { const d = S.partial[o.id]; return d && d.reason && (d.reason !== 'OTHER' || d.remark.trim()); });
  const n = S.docNo.trim();
  v.docError = n.length > 255 ? tr('Use 255 characters or fewer.') : USED_DOCS[n] ? tr('This number is already used by {id}.', {id: USED_DOCS[n]}) : '';
  v.doc = !v.docError;
  v.files = S.files.every(f => f.state === 'ready');
  v.datesError = arr ? ((S.dispatched && S.dispatched > TODAY) || (S.arrived && S.arrived > TODAY) ? tr('Dates cannot be in the future.') : (S.dispatched && S.arrived && S.arrived < S.dispatched) ? tr('Date arrived cannot be before date dispatched.') : '') : '';
  v.dates = !v.datesError;
  v.ok = v.geo && v.route && v.selection && v.partial && v.doc && v.files && v.dates;
  return v;
}

  truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62L18.3 9.38a1 1 0 0 0-.78-.38H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>'
};

/* ---------------- Render helpers ---------------- */
const bn = n => `<button type="button" class="bn" data-note="${n}" aria-label="Business note ${n}">${n}</button>`;
const nc = (ticket, text) => `<p class="nc-label">New component · <a href="https://linear.app/front-line-ltd/issue/${ticket}" target="_blank" rel="noopener">${ticket}</a>${text ? ' — ' + esc(text) : ''}</p>`;
const opt = (value, label, current) => `<option value="${esc(value)}"${value === current ? ' selected' : ''}>${esc(label)}</option>`;
const field = (id, label, control, {required, optional, hint, error} = {}) =>
  `<div class="field"><label class="label" for="${id}">${esc(label)}${required ? '<span class="req" aria-hidden="true">*</span>' : ''}${optional ? ` <span class="opt">· ${T('Optional')}</span>` : ''}</label>${control}${error ? `<p class="error" id="${id}-err">${esc(error)}</p>` : hint ? `<p class="hint">${esc(hint)}</p>` : ''}</div>`;
const select = (id, options, value, {disabled, placeholder, invalid, describedBy} = {}) =>
  `<select class="control${invalid ? ' invalid' : ''}" id="${id}" data-bind="${id}"${disabled ? ' disabled' : ''}${describedBy ? ` aria-describedby="${describedBy}"` : ''}${invalid ? ' aria-invalid="true"' : ''}>${placeholder !== undefined ? opt('', placeholder, value) : ''}${options.map(o => opt(o[0], o[1], value)).join('')}</select>`;
const pill = status => `<span class="pill ${PO_TONE[status] || 'tone-neutral'}">${esc(status)}</span>`;
const fmtKg = n => n == null ? '—' : n.toLocaleString(S.lang === 'el' ? 'el-GR' : 'en-GB', {maximumFractionDigits:1});

function renderHeader() {
  const nav = [['Dashboard',''],['Purchase orders',''],['Shipments','current'],['Warehouses',''],['Users',''],['Companies','']];
  return `<header class="shell-header"><div class="shell-inner"><div class="row-flex"><span class="brand">Frontline console</span>
    <nav class="nav" aria-label="Main">${nav.map(([l, c]) => `<a href="#" ${c ? 'aria-current="page"' : ''}>${c ? I.truck : ''}${T(l)}</a>`).join('')}</nav></div>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="${S.lang === 'en'}">EN</button><button type="button" data-lang="el" aria-pressed="${S.lang === 'el'}">EL</button></div></div></header>`;
}

function renderStatus() {
  const arr = isArr();
  const steps = ['Preparing','Ready for dispatch','Dispatched','Arrived'];
  const current = arr ? 3 : 0;
  return `<div class="subcard nc">${nc('FRO-324', 'Preparing / Arrived status and indicator')}
    <div class="status-row">${field('status', tr('Status'), select('status', [['PREPARING', tr('Preparing')], ['ARRIVED', tr('Arrived')]], S.status), {required:true})}${bn(2)}</div>
    <ol class="stepper" aria-label="${T('Shipment status')}">${steps.map((s, i) => `<li class="step${i === current ? ' current' : ''}${arr && i < 3 ? ' unrecorded' : ''}"${i === current ? ' aria-current="step"' : ''}><span class="num">${i + 1}</span><span>${T(s)}</span></li>`).join('')}</ol></div>`;
}

function renderDetails(v) {
  const arr = isArr();
  const loading = S.ui === 'loading';
  const countryOpts = loading ? [] : COUNTRIES.map(c => [c.id, c.name]);
  const citiesOf = cc => CITIES.filter(c => c.country === cc).map(c => [c.id, c.name]);
  const ow = originWarehouses();
  const owDisabled = !S.ocity && !S.originWh;
  const owPlaceholder = !S.ocity ? tr('Select the origin city first') : ow.length ? tr('Select origin') : tr('No matching warehouse in the selected destination city').replace(tr('destination'), tr('origin'));
  const owBad = S.originWh && whById(S.originWh)?.city !== S.ocity;
  const modeOpts = [['ROAD', tr('Road')], ['AIR', tr('Air')], ['SEA', tr('Sea')]];
  const docType = S.mode ? DOC[S.mode] : tr('Transport reference');
  const docLabel = tr('Document number');
  return `<section class="card nc" aria-labelledby="h-details"><div class="card-header"><h2 class="card-title text-subheading" id="h-details">${T('Shipment details')}</h2></div>
  <div class="card-body stack">
    ${nc('FRO-325', 'Optional document number and type at creation')}
    ${renderStatus()}
    <div class="grid4">
      ${field('oc', tr('Origin country'), select('oc', countryOpts, S.oc, {placeholder: loading ? tr('Loading…') : tr('Select country'), disabled: loading}), {required: !arr, optional: arr})}
      ${field('ocity', tr('Origin city'), select('ocity', citiesOf(S.oc), S.ocity, {placeholder: S.oc ? tr('Select city') : tr('Select country'), disabled: !S.oc}), {required: !arr, optional: arr})}
      ${field('dc', tr('Destination country'), select('dc', countryOpts, S.dc, {placeholder: loading ? tr('Loading…') : tr('Select country'), disabled: loading}), {required:true})}
      ${field('dcity', tr('Destination city'), select('dcity', citiesOf(S.dc), S.dcity, {placeholder: S.dc ? tr('Select city') : tr('Select country'), disabled: !S.dc}), {required:true})}
      ${field('originWh', tr('Origin warehouse'), select('originWh', ow.map(w => [w.id, whLabel(w)]).concat(owBad ? [[S.originWh, whLabel(whById(S.originWh))]] : []), S.originWh, {placeholder: owPlaceholder, disabled: owDisabled, invalid: owBad, describedBy: owBad ? 'originWh-err' : ''}), {required: !arr, optional: arr, error: owBad ? tr('The origin warehouse must be in the selected origin city') : ''})}
      ${field('mode', tr('Mode'), select('mode', modeOpts, S.mode, arr ? {placeholder: tr('Unknown — not recorded')} : {}), {required: !arr, optional: arr})}
      ${field('docType', tr('Document type'), `<input class="control" id="docType" readonly value="${esc(docType)}">`)}
      ${field('docNo', docLabel, `<input class="control mono${v.docError ? ' invalid' : ''}" id="docNo" data-bind="docNo" maxlength="300" autocomplete="off" value="${esc(S.docNo)}"${v.docError ? ' aria-invalid="true" aria-describedby="docNo-err"' : ''}>`, {optional:true, error: v.docError})}
    </div>
    <div class="nc" style="padding:.25rem 0 .25rem">${nc('FRO-324', 'Arrival dates')}
      <div class="grid4">
        ${field('dispatched', tr('Date dispatched'), `<input type="date" class="control mono" id="dispatched" data-bind="dispatched" max="${TODAY}" value="${esc(S.dispatched)}"${arr ? '' : ' disabled'}>`, {optional: arr})}
        ${field('arrived', tr('Date arrived'), `<input type="date" class="control mono${v.datesError ? ' invalid' : ''}" id="arrived" data-bind="arrived" max="${TODAY}" value="${esc(S.arrived)}"${arr ? '' : ' disabled'}>`, {optional: arr, error: v.datesError})}
      </div></div>
    <p class="hint">${bn(3)} ${bn(4)} ${bn(5)} ${bn(6)}</p>
  </div></section>`;
}

function renderPurpose(v) {
  const arr = isArr();
  const purposes = [['NETWORK_TRANSFER', tr('Warehouse transfer')], ['THIRD_PARTY_TRANSFER', tr('Third-party agent')], ['DELIVERY_TO_VESSEL', tr('Direct delivery on board')], ['DELIVERY_TO_LAUNCH_STATION', tr('Via agent or launch station')]];
  let dest;
  if (S.purpose === 'NETWORK_TRANSFER') {
    const ws = destWarehouses();
    const placeholder = !S.dcity ? tr('Select the destination city first') : ws.length ? tr('Choose a warehouse') : tr('No matching warehouse in the selected destination city');
    dest = select('dest', ws.map(w => [w.id, whLabel(w)]), S.dest, {placeholder, disabled: !S.dcity || !ws.length});
  } else if (S.purpose === 'DELIVERY_TO_VESSEL') {
    const vessels = [...new Set(participating().map(o => o.vessel))];
    const label = vessels.length === 1 ? vessels[0] : tr('Derived from selected Orders');
    dest = select('dest', [], '', {placeholder: label, disabled:true, invalid: v.vesselError, describedBy: v.vesselError ? 'dest-err' : ''});
  } else {
    dest = select('dest', AGENTS.map(a => [a.id, a.name]), S.dest, {placeholder: S.purpose === 'THIRD_PARTY_TRANSFER' ? tr('Choose a third-party agent') : tr('Agent / launch station')});
  }
  return `<section class="card" aria-labelledby="h-purpose"><div class="card-header"><h2 class="card-title text-subheading" id="h-purpose">${T('Shipment purpose')} ${bn(7)}</h2></div>
  <div class="card-body"><div class="grid2">
    ${field('purpose', tr('Purpose'), select('purpose', arr ? purposes.slice(0, 1) : purposes, S.purpose, {disabled: arr}), {required:true})}
    ${field('dest', S.purpose === 'NETWORK_TRANSFER' ? tr('Destination warehouse') : tr('Destination details'), dest, {required:true, error: v.vesselError ? tr('All participating Orders must reference the same vessel.') : ''})}
  </div></div></section>`;
}

function renderNotes() {
  return `<section class="card nc" aria-labelledby="h-notes"><div class="card-header"><h2 class="card-title text-subheading" id="h-notes">${T('Notes')} ${bn(8)}</h2></div>
  <div class="card-body">${nc('FRO-292', '')}<div class="grid2">
    ${field('notesInt', tr('Internal Notes'), `<textarea class="control" id="notesInt" data-bind="notesInt" rows="4">${esc(S.notesInt)}</textarea>`, {optional:true})}
    ${field('notesExt', tr('External Notes'), `<textarea class="control" id="notesExt" data-bind="notesExt" rows="4">${esc(S.notesExt)}</textarea>`, {optional:true})}
  </div></div></section>`;
}

function orderRows(o, {hist} = {}) {
  const total = o.collis.length;
  const count = hist ? (S.histSel.has(o.id) ? total : 0) : selectedCount(o);
  const whole = hist || o.status !== 'IN_STOCK';
  const expanded = S.expanded.has(o.id);
  const disabled = hist && o.excluded;
  const label = expanded ? tr('Hide collis for {po}', {po:o.id}) : tr('Show collis for {po}', {po:o.id});
  let html = `<tr class="po-row${count ? ' selected' : ''}"><td><input type="checkbox" class="check" data-po="${o.id}"${hist ? ' data-hist="1"' : ''} aria-label="${esc(o.id)}"${count === total ? ' checked' : ''}${disabled ? ' disabled' : ''}${count && count < total ? ' data-indeterminate="1"' : ''}></td>
    <td><span class="mono" style="font-weight:600">${esc(o.id)}</span> ${o.fixture ? `<span class="badge tone-warning">${T('Simulated new order')}</span>` : ''}</td><td>${pill(o.status)}</td><td>${esc(o.client)}</td><td>${esc(o.vessel)}</td>
    <td class="cell-end"><span class="mono">${count}/${total}</span> ${disabled ? `<span class="badge tone-danger">${T(o.excluded, {id:o.excludedBy})}</span>` : hist ? `<span class="badge ${o.match ? 'tone-accent' : 'tone-neutral'}">${o.match ? T('Existing arrival') + ' · ' + o.match : T('New arrival — AWAITING_IMPORT')}</span>` : ''}
    <button type="button" class="btn btn-ghost btn-sm icon-btn" data-expand="${o.id}" aria-expanded="${expanded}" aria-controls="c-${o.id}" aria-label="${esc(label)}" title="${esc(label)}">${expanded ? I.up : I.down}</button></td></tr>`;
  if (expanded) html += o.collis.map(c => {
    const on = hist ? S.histSel.has(o.id) : S.sel.has(c.id);
    return `<tr id="c-${o.id}" class="${on ? 'selected' : ''}"><td></td><td class="indent" colspan="3"><span class="mono">${esc(c.id)}</span> <span class="muted">· ${esc(c.desc)}</span></td><td class="muted mono">${c.dims ? esc(c.dims) + ' cm' : '—'}</td>
      <td class="cell-end"><input type="checkbox" class="check" data-colli="${c.id}" aria-label="${esc(c.id)}"${on ? ' checked' : ''}${whole ? ` disabled title="${T('Upcoming POs must be selected in full')}"` : ''}></td></tr>`;
  }).join('');
  return html;
}

function ordersTable(orders, hist) {
  return `<div class="table-wrap"><table><thead><tr><th style="width:2.5rem"><span class="sr-only">${T('Select')}</span></th><th>${T('PO / colli')}</th><th>${T('Status')}</th><th>${T('Client')}</th><th>${T('Vessel')}</th><th class="cell-end">${T('Selection')}</th></tr></thead>
    <tbody>${orders.map(o => orderRows(o, {hist})).join('')}</tbody></table></div>`;
}

function renderSelection() {
  const arr = isArr();
  const loading = S.ui === 'loading', error = S.ui === 'error';
  let body;
  if (!arr && S.subTab === 'src') body = renderSources();
  else {
    const orders = arr ? histOrders() : eligibleOrders();
    const empty = arr ? (!S.dest ? tr('Select the receiving warehouse to list Orders for this arrival.') : tr('No eligible purchase orders found.')) : (!S.originWh ? tr('Select an origin warehouse to list eligible purchase orders.') : tr('No eligible purchase orders found.'));
    body = `<div class="row-flex" style="flex-wrap:wrap;margin-bottom:.75rem"><div class="with-icon" style="flex:1 1 18rem">${I.search}<input class="control" id="search" data-bind="search" type="search" placeholder="${T('Search PO, vessel, reference, or tracking code')}" aria-label="${T('Search PO, vessel, reference, or tracking code')}" value="${esc(S.search)}"></div>
      ${arr ? '' : `<div class="nc" style="border-radius:var(--radius-md)"><button type="button" class="btn btn-secondary btn-md" id="create-order-btn" data-act="open-order">${I.plus}${T('Create new order')}</button></div>`}</div>
      ${arr ? `<p class="hint" style="margin:0 0 .75rem">${T('Whole Orders only when recording an arrived shipment.')}</p>` : ''}
      ${loading ? '<div class="stack"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>'
        : error ? `<div class="alert tone-danger" role="alert">${I.bad}<div>${T('Could not load eligible purchase orders.')} <button type="button" class="btn btn-secondary btn-sm" data-act="retry">${T('Retry')}</button></div></div>`
        : orders.length ? ordersTable(orders, arr) : `<p class="empty-box">${esc(empty)}</p>`}`;
  }
  return `<section class="card" aria-labelledby="h-select"><div class="card-header"><h2 class="card-title text-subheading" id="h-select">${T('Select purchase orders and collis')} ${bn(9)}</h2></div>
  <div class="card-body">${arr ? '' : `<div class="nc" style="margin-bottom:1rem">${nc('FRO-323', 'From arrived shipments')}${tabsHtml('sub', [['po', tr('By purchase order')], ['src', tr('From arrived shipments')]], S.subTab)}</div>`}${body}</div></section>`;
}

function renderSources() {
  const list = sourcesForOrigin();
  if (S.ui === 'loading') return '<div class="stack"><div class="skeleton"></div><div class="skeleton"></div></div>';
  if (S.ui === 'error') return `<div class="alert tone-danger" role="alert">${I.bad}<div>${T('Could not load eligible purchase orders.')} <button type="button" class="btn btn-secondary btn-sm" data-act="retry">${T('Retry')}</button></div></div>`;
  const search = `<div class="with-icon" style="margin-bottom:.75rem">${I.search}<input class="control" id="srcSearch" data-bind="srcSearch" type="search" placeholder="${T('Search shipment or transport document number')}" aria-label="${T('Search shipment or transport document number')}" value="${esc(S.srcSearch)}"></div>`;
  if (!S.originWh) return search + `<p class="empty-box">${T('Select an origin warehouse to list eligible purchase orders.')}</p>`;
  if (!list.length) return search + `<p class="empty-box">${T('No arrived shipments at this origin.')}</p>`;
  const rows = list.map(s => {
    const avail = s.contents.filter(c => c.avail);
    const on = avail.filter(c => S.sel.has(c.colli)).length;
    const expanded = S.srcExpanded.has(s.id);
    const label = expanded ? tr('Hide contents of {id}', {id:s.id}) : tr('Show contents of {id}', {id:s.id});
    let html = `<tr class="po-row"><td><input type="checkbox" class="check" data-src="${s.id}" aria-label="${T('Select all available collis of {id}', {id:s.id})}"${avail.length && on === avail.length ? ' checked' : ''}${on && on < avail.length ? ' data-indeterminate="1"' : ''}${avail.length ? '' : ' disabled'}></td>
      <td class="mono" style="color:var(--accent-strong);font-weight:600">${s.id}</td><td>${esc(s.origin)} → ${esc(s.dest)}</td><td>${esc(DOC[s.mode])}</td><td class="mono">${esc(s.doc)}</td>
      <td class="cell-end"><span class="mono">${avail.length}/${s.contents.length}</span> <button type="button" class="btn btn-ghost btn-sm icon-btn" data-src-expand="${s.id}" aria-expanded="${expanded}" aria-controls="s-${s.id}" aria-label="${esc(label)}" title="${esc(label)}">${expanded ? I.up : I.down}</button></td></tr>`;
    if (expanded) html += s.contents.map(c => `<tr id="s-${s.id}"><td></td><td class="indent mono">${esc(c.po)}</td><td class="mono" colspan="2">${esc(c.colli)}</td>
      <td>${c.avail ? `<span class="pill tone-cyan">${T('Available')}</span>` : `<span class="pill tone-info">${T('Reserved by {id}', {id:c.by})}</span>`}</td>
      <td class="cell-end"><input type="checkbox" class="check" data-colli="${c.colli}" aria-label="${esc(c.colli)}"${S.sel.has(c.colli) ? ' checked' : ''}${c.avail ? '' : ' disabled'}></td></tr>`).join('');
    return html;
  }).join('');
  return search + `<div class="table-wrap"><table><thead><tr><th style="width:2.5rem"><span class="sr-only">${T('Select')}</span></th><th>${T('Shipment number')}</th><th>${T('Route')}</th><th>${T('Transport document type')}</th><th>${T('Transport document number')}</th><th class="cell-end">${T('Available collis')}</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint">${bn(10)}</p>`;
}

function renderPartials() {
  const list = partialOrders();
  const arr = isArr();
  let body;
  if (arr) body = `<p class="text-body-sm muted" style="margin:0">${T('Whole Orders only when recording an arrived shipment.')}</p>`;
  else if (!S.sel.size) body = `<p class="text-body-sm muted" style="margin:0">${T('No partial selections to confirm.')}</p>`;
  else if (!list.length) body = `<p class="text-body-sm muted" style="margin:0">${T('Every selected PO is included in full. No child PO is needed.')}</p>`;
  else {
    const reasons = [['OPERATIONAL_SEPARATION', tr('Operational separation')], ['UNCOLLECTABLE_REMAINDER', tr('Uncollectable remainder')], ['OTHER', tr('Other')]];
    body = (list.length > 1 ? `<div class="subcard" style="margin-bottom:.75rem"><p class="label" style="margin:0 0 .5rem">${T('Apply one decision to all partial POs')}</p><div class="grid4" style="align-items:end">
        ${field('bulkReason', tr('Reason'), select('bulkReason', reasons, S.bulk.reason, {placeholder: tr('Select reason')}))}
        ${field('bulkRemark', tr('Remark'), `<input class="control" id="bulkRemark" data-bind="bulkRemark" value="${esc(S.bulk.remark)}">`)}
        <div><button type="button" class="btn btn-secondary btn-md" data-act="bulk">${T('Apply to all POs')}</button></div></div></div>` : '')
      + list.map(o => {
        const d = S.partial[o.id] || {reason:'', remark:''};
        const remaining = o.collis.filter(c => !S.sel.has(c.id));
        const remarkErr = d.reason === 'OTHER' && !d.remark.trim();
        return `<div class="partial-row"><div><p class="mono" style="margin:0;font-weight:600">${esc(o.id)}</p><p class="hint" style="margin:0">${T('{count} remaining', {count: remaining.length})}</p></div>
          <div class="chips">${remaining.map(c => `<span class="badge mono">${esc(c.id)}</span>`).join('')}</div>
          ${field('reason-' + o.id, tr('Reason'), select('reason-' + o.id, reasons, d.reason, {placeholder: tr('Select reason'), invalid: !d.reason}), {required:true})}
          ${field('remark-' + o.id, tr('Remark'), `<input class="control${remarkErr ? ' invalid' : ''}" id="remark-${o.id}" data-bind="remark-${o.id}" value="${esc(d.remark)}"${remarkErr ? ` aria-invalid="true" aria-describedby="remark-${o.id}-err"` : ''}>`, {required: d.reason === 'OTHER', error: remarkErr ? tr('Remark is required for Other') : ''})}
          <div><button type="button" class="btn btn-secondary btn-md" data-include="${o.id}">${T('Include remaining collis')}</button></div></div>`;
      }).join('');
  }
  return `<section class="card nc" aria-labelledby="h-partial"><div class="card-header"><h2 class="card-title text-subheading" id="h-partial">${T('Partial selections')} ${bn(11)}</h2></div><div class="card-body">${nc('FRO-325', 'Compact partial-selection rows')}${body}</div></section>`;
}

function renderDocuments() {
  const files = S.ui === 'empty' ? [] : S.files;
  return `<section class="card card-pad nc" aria-labelledby="h-att">${nc('FRO-342', 'Pending files before creation')}
    <div class="row-flex" style="justify-content:space-between;flex-wrap:wrap"><div><h3 class="row-flex text-subheading" id="h-att" style="margin:0"><span style="color:var(--accent);display:inline-flex;width:1rem">${I.clip}</span>${T('Attachments')} ${bn(12)}</h3>
      <p class="text-body-sm muted" style="margin:.25rem 0 0">${T('Files stay pending until the shipment is created.')}</p></div>
      <label class="btn btn-secondary btn-md" for="file-input" tabindex="0" id="file-label">${I.plus}${T('Choose documents or photos')}</label><input id="file-input" class="sr-only" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.gif,.doc,.docx,.xls,.xlsx,.csv,.txt"></div>
    <p class="hint" style="margin:.5rem 0 0">${T('PDF, images, Word, Excel, CSV or text · up to 25 MB each')}</p>
    <div class="stack" style="margin-top:1rem">${files.length ? files.map(f => `<div class="file-row"><div class="row-flex" style="min-width:0"><span class="file-icon">${f.kind === 'PHOTO' ? I.image : I.file}</span>
        <div style="min-width:0"><p style="margin:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</p><p class="text-caption muted" style="margin:0">${T(f.kind === 'PHOTO' ? 'Photo' : 'Document')} · ${esc(f.size)} · Demo operator · ${esc(f.at)}</p>
        ${f.state === 'uploading' ? `<div class="progress" role="progressbar" aria-label="${T('Uploading')}" aria-valuenow="${f.pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${f.pct}%"></span></div>` : f.state === 'error' ? `<p class="error" style="margin:.25rem 0 0" role="alert">${T('Upload failed — check the connection and retry.')}</p>` : `<span class="badge tone-warning" style="margin-top:.25rem">${T('Pending')}</span>`}</div></div>
        <div class="row-flex">${f.state === 'error' ? `<button type="button" class="btn btn-secondary btn-sm" data-retry="${f.id}">${T('Retry')}</button>` : ''}${f.state === 'ready' ? `<button type="button" class="btn btn-ghost btn-sm" data-act="noop">${T('Download')}</button>` : ''}<button type="button" class="btn btn-ghost btn-sm" data-remove="${f.id}">${T('Remove')}</button></div></div>`).join('')
      : `<p class="empty-box">${T('No attachments uploaded.')}</p>`}</div></section>`;
}

function tabsHtml(group, tabs, current) {

/* ---------------- Behaviour ---------------- */
function setField(id, value) {
  if (id.startsWith('reason-') || id.startsWith('remark-')) {
    const po = id.slice(7); const d = S.partial[po] || (S.partial[po] = {reason:'', remark:''});
    if (id.startsWith('reason-')) d.reason = value; else d.remark = value; return;
  }
  if (id === 'bulkReason') { S.bulk.reason = value; return; }
  if (id === 'bulkRemark') { S.bulk.remark = value; return; }
  if (id === 'status') { S.status = value; if (value === 'ARRIVED') { S.purpose = 'NETWORK_TRANSFER'; S.subTab = 'po'; } S.histSel.clear(); return; }
  if (id === 'oc') { S.oc = value; S.ocity = ''; clearOrigin(); return; }
  if (id === 'ocity') { S.ocity = value; if (S.originWh && whById(S.originWh)?.city !== value) clearOrigin(); return; }
  if (id === 'dc') { S.dc = value; S.dcity = ''; clearDest(); return; }
  if (id === 'dcity') { S.dcity = value; if (S.dest && S.purpose === 'NETWORK_TRANSFER' && whById(S.dest)?.city !== value) clearDest(); return; }
  if (id === 'originWh') { S.originWh = value; S.sel.clear(); S.partial = {}; S.srcExpanded.clear(); return; }
  if (id === 'purpose') { S.purpose = value; S.dest = ''; return; }
  if (id === 'dest') { S.dest = value; if (isArr()) S.histSel.clear(); return; }
  S[id] = value;
}
function clearOrigin() { S.originWh = ''; S.sel.clear(); S.partial = {}; S.srcExpanded.clear(); }
function clearDest() { S.dest = ''; if (isArr()) S.histSel.clear(); }
function cleanPartials() { for (const po of Object.keys(S.partial)) if (!partialOrders().some(o => o.id === po)) delete S.partial[po]; }

document.addEventListener('input', e => {
  const id = e.target.dataset.bind; if (!id || e.target.tagName === 'SELECT') return;
  setField(id, e.target.value); render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.tagName === 'SELECT' && t.dataset.bind) { setField(t.dataset.bind, t.value); render(); return; }
  if (t.type === 'date') { setField(t.dataset.bind, t.value); render(); return; }
  if (t.id === 'file-input') { addFiles([...t.files]); t.value = ''; return; }
  if (t.dataset.po) {
    if (t.dataset.hist) { t.checked ? S.histSel.add(t.dataset.po) : S.histSel.delete(t.dataset.po); }
    else { const o = allOrders().find(x => x.id === t.dataset.po); o.collis.forEach(c => t.checked ? S.sel.add(c.id) : S.sel.delete(c.id)); cleanPartials(); }
    render(); return;
  }
  if (t.dataset.colli) {
    const hit = findColli(t.dataset.colli);
    if (hit && hit.o.status !== 'IN_STOCK') hit.o.collis.forEach(c => t.checked ? S.sel.add(c.id) : S.sel.delete(c.id));
    else t.checked ? S.sel.add(t.dataset.colli) : S.sel.delete(t.dataset.colli);
    cleanPartials(); render(); return;
  }
  if (t.dataset.src) { const s = SOURCES.find(x => x.id === t.dataset.src); s.contents.filter(c => c.avail).forEach(c => t.checked ? S.sel.add(c.colli) : S.sel.delete(c.colli)); cleanPartials(); render(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('button, [data-act]'); if (!b) return;
  if (b.dataset.lang) { S.lang = b.dataset.lang; render(); return; }
  if (b.dataset.note) { S.notesOpen = true; S.activeNote = +b.dataset.note; render(); document.getElementById('note-' + b.dataset.note)?.scrollIntoView({block:'nearest'}); return; }
  if (b.dataset.tab) { switchTab(b.dataset.tabGroup, b.dataset.tab); return; }
  if (b.dataset.expand) { S.expanded.has(b.dataset.expand) ? S.expanded.delete(b.dataset.expand) : S.expanded.add(b.dataset.expand); render(); return; }
  if (b.dataset.srcExpand) { S.srcExpanded.has(b.dataset.srcExpand) ? S.srcExpanded.delete(b.dataset.srcExpand) : S.srcExpanded.add(b.dataset.srcExpand); render(); return; }
  if (b.dataset.include) { allOrders().find(o => o.id === b.dataset.include).collis.forEach(c => S.sel.add(c.id)); cleanPartials(); render(); return; }
  if (b.dataset.remove) { S.files = S.files.filter(f => f.id !== +b.dataset.remove); render(); return; }
  if (b.dataset.retry) { const f = S.files.find(x => x.id === +b.dataset.retry); f.state = 'uploading'; f.pct = 0; simulateUpload(f); render(); return; }
  if (b.dataset.tool) {
    const v = b.dataset.val;
    if (b.dataset.tool === 'state') S.ui = v; else if (b.dataset.tool === 'nc') S.showNc = v === '1'; else S.showBn = v === '1';
    S.toolsOpen = true; render(); return;
  }
  const act = b.dataset.act; if (!act) return;
  S.toolsOpen = !!e.target.closest('.tools');
  if (act === 'open-review') { S.reviewOpen = true; S.submitError = ''; render(); document.querySelector('#review [data-act="close-review"].icon-btn')?.focus(); }
  else if (act === 'close-review') { S.reviewOpen = false; render(); document.getElementById('create-shipment-btn').focus(); }
  else if (act === 'review-files') { S.reviewOpen = false; S.tab = 'documents'; render(); document.getElementById('tab-main-documents').focus(); }
  else if (act === 'confirm') confirmCreate();
  else if (act === 'open-order') { S.orderOpen = true; render(); document.querySelector('#order-modal .icon-btn')?.focus(); }
  else if (act === 'close-order') { S.orderOpen = false; render(); document.getElementById('create-order-btn')?.focus(); }
  else if (act === 'create-order') createOrder();
  else if (act === 'retry') { S.ui = 'default'; render(); }
  else if (act === 'bulk') { partialOrders().forEach(o => S.partial[o.id] = {reason: S.bulk.reason, remark: S.bulk.remark}); render(); }
  else if (act === 'notes') { S.notesOpen = !S.notesOpen; render(); }
  else if (act === 'fill') { fillPreparing(); render(); }
  else if (act === 'fill-partial') { fillPreparing(); S.sel.delete('HU-DEMO-STOCK-MULTI-A-3'); ['HU-DEMO-STOCK-MULTI-B-1'].forEach(id => S.sel.add(id)); S.purpose = 'NETWORK_TRANSFER'; S.tab = 'orders'; render(); }
  else if (act === 'fill-arrived') { S.status = 'ARRIVED'; S.purpose = 'NETWORK_TRANSFER'; S.dc = 'GR'; S.dcity = 'ATH'; S.dest = 'ATH-HUB'; S.oc = 'NL'; S.ocity = ''; S.originWh = ''; S.mode = ''; S.histSel = new Set(['PO-0000011','PO-0000012']); S.arrived = '2026-09-28'; render(); }
  else if (act === 'fail-upload') { S.files.push({id: Date.now(), name:'demo-delivery-scan.pdf', kind:'DOCUMENT', size:'1.2 MB', at: TODAY, state:'error', pct:0}); render(); }
});
function fillPreparing() {
  Object.assign(S, {status:'PREPARING', oc:'GR', ocity:'ATH', originWh:'ATH-HUB', dc:'GR', dcity:'PIR', purpose:'NETWORK_TRANSFER', dest:'PIR-AGENT-HUB', mode:'ROAD', docNo:'CMR-DEMO-3003', partial:{}});
  S.sel = new Set(['HU-DEMO-STOCK-MULTI-A-1','HU-DEMO-STOCK-MULTI-A-2','HU-DEMO-STOCK-MULTI-A-3','HU-DEMO-STOCK-A-1']);
}
function switchTab(group, value) {
  if (group === 'main') { S.tab = value; const u = new URL(location); u.searchParams.set('tab', value); history.replaceState(null, '', u); }
  else S.subTab = value;
  render(); document.getElementById(`tab-${group}-${value}`)?.focus();
}
document.addEventListener('keydown', e => {
  const tab = e.target instanceof Element ? e.target.closest('[role=tab]') : null;
  if (tab && ['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) {
    const tabs = [...tab.parentElement.querySelectorAll('[role=tab]')]; let i = tabs.indexOf(tab);
    i = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    e.preventDefault(); switchTab(tabs[i].dataset.tabGroup, tabs[i].dataset.tab); return;
  }
  if (e.target.id === 'file-label' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); document.getElementById('file-input').click(); return; }
  const modal = document.querySelector('.scrim .modal');
  if (modal && e.key === 'Escape') { if (S.orderOpen) { S.orderOpen = false; render(); document.getElementById('create-order-btn')?.focus(); } else { S.reviewOpen = false; render(); document.getElementById('create-shipment-btn').focus(); } return; }
  if (modal && e.key === 'Tab') {
    const f = [...modal.querySelectorAll('button:not([disabled]),a,input:not([disabled]),select:not([disabled]),iframe')];
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
let fileSeq = 1;
function addFiles(list) {
  for (const file of list) {
    const tooBig = file.size > 25 * 1024 * 1024, empty = file.size === 0;
    const f = {id: fileSeq++, name: file.name, kind: /^image\//.test(file.type) ? 'PHOTO' : 'DOCUMENT', size: (file.size / 1048576).toFixed(1) + ' MB', at: TODAY, state: tooBig || empty ? 'error' : 'uploading', pct: 0};
    S.files.push(f); if (f.state === 'uploading') simulateUpload(f);
  }
  render();
}
function simulateUpload(f) {
  const tick = () => { if (!S.files.includes(f)) return; f.pct = Math.min(100, f.pct + 25); if (f.pct >= 100) f.state = 'ready'; if (S.tab === 'documents' || S.reviewOpen) render(); if (f.state === 'uploading') setTimeout(tick, 350); };
  setTimeout(tick, 350);
}
function confirmCreate() {
  if (S.creating || !validation().ok) return;
  if (S.ui === 'error') { S.submitError = 'The server rejected the shipment: HU-DEMO-STOCK-MULTI-A-2 is already reserved by SH-DEMO-0150. Your draft is unchanged.'; render(); return; }
  S.creating = true; render();
  setTimeout(() => { S.creating = false; S.reviewOpen = false; S.toast = tr(isArr() ? 'Simulated: arrival recorded as ARRIVED. Nothing was saved.' : 'Simulated: shipment created as PREPARING. Nothing was saved.'); render(); document.getElementById('create-shipment-btn').focus(); setTimeout(() => { S.toast = ''; render(); }, 5000); }, 600);
}
let orderSeq = 13;
function createOrder() {
  if (S.creating) return; S.creating = true;
  const id = 'PO-00000' + orderSeq++, cid = 'HU-DEMO-NEW-' + (orderSeq - 13);
  S.extraOrders.push({id, status:'IN_STOCK', wh: S.originWh || 'ATH-HUB', client:'Demo Client Company', vessel:'MV Aegean Star', fixture:true, collis:[colli(cid, 'Simulated new order', null, null)]});
  if (!S.originWh) S.extraOrders[S.extraOrders.length - 1].wh = '__none';
  S.sel.add(cid); S.orderOpen = false; S.tab = 'orders'; S.subTab = 'po'; S.creating = false; render();
  document.getElementById('create-order-btn')?.focus();
}
render();
</script>
